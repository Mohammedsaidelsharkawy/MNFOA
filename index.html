<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StatBench</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel2:#f0f2f5;--text:#1b1f24;--muted:#5d6670;--border:#dde1e6;
  --accent:#2563eb;--accent-soft:#e3ebfd;--accent2:#d9480f;--sig:#0f7b3f;--danger:#c92a2a;--grid:#e8ebef;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101317;--panel:#171b21;--panel2:#1f242b;--text:#e5e8ec;--muted:#98a2ad;--border:#2b323a;
  --accent:#6d9cff;--accent-soft:#1d2942;--accent2:#ff8a4c;--sig:#4cc38a;--danger:#ff6b6b;--grid:#252b32;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101317;--panel:#171b21;--panel2:#1f242b;--text:#e5e8ec;--muted:#98a2ad;--border:#2b323a;
  --accent:#6d9cff;--accent-soft:#1d2942;--accent2:#ff8a4c;--sig:#4cc38a;--danger:#ff6b6b;--grid:#252b32;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent;border-color:transparent}
button.danger:hover{border-color:var(--danger);color:var(--danger)}
input,select,textarea{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--accent)}
.tabs{display:flex;gap:4px}
.tabs button{border:none;background:transparent;padding:6px 14px;border-radius:7px;color:var(--muted)}
.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
.count:empty{display:none}

.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 53px)}
.side{background:var(--panel);border-right:1px solid var(--border);padding:12px 10px;overflow:auto}
.side h4{margin:14px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.side h4:first-child{margin-top:2px}
.side button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:6px 10px;border-radius:6px}
.side button:hover{background:var(--panel2)}
main{min-width:0;padding:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .info{color:var(--muted);margin-left:auto;font-size:13px}

.tablewrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:calc(100vh - 140px);box-shadow:var(--shadow)}
table.data{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
table.data th,table.data td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0}
table.data thead th{position:sticky;top:0;background:var(--panel2);z-index:2}
table.data .rn{position:sticky;left:0;background:var(--panel2);color:var(--muted);font-size:12px;text-align:right;padding:0 6px;min-width:46px;z-index:1}
table.data thead .rn{z-index:3}
table.data td input{border:none;border-radius:0;background:transparent;width:120px;padding:5px 8px}
table.data td input:focus{outline:2px solid var(--accent);background:var(--accent-soft)}
.colhead{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 6px}
.colhead input{width:104px;font-weight:600;border:1px solid transparent;background:transparent;padding:3px 4px}
.colhead input:hover{border-color:var(--border)}
.badge{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:600;font-family:ui-monospace,monospace}
.badge.n{background:var(--accent-soft);color:var(--accent)}
.badge.t{background:var(--panel);color:var(--accent2);border:1px solid var(--border)}
.x{border:none;background:transparent;color:var(--muted);padding:0 5px;font-size:15px;line-height:1}
.x:hover{color:var(--danger)}
.rn .x{visibility:hidden;margin-right:2px}
tr:hover .rn .x{visibility:visible}
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);margin:0 0 6px;font-size:20px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}

#results{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel2)}
.card>header h3{margin:0;font-size:15px}
.card>header .meta{color:var(--muted);font-size:12px;margin-left:auto}
.card .body{padding:14px;overflow-x:auto}
.card h5{margin:16px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.card h5:first-child{margin-top:0}
table.res{border-collapse:collapse;margin:2px 0 10px;font-variant-numeric:tabular-nums;font-size:13px}
table.res th,table.res td{padding:5px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
table.res th{font-weight:600;border-bottom:2px solid var(--text);vertical-align:bottom}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res tr:last-child td{border-bottom:2px solid var(--text)}
table.res .sub{font-weight:400;font-size:11px;color:var(--muted)}
td.sig{color:var(--sig);font-weight:600}
td.hi{font-weight:700}
table.data tr.off td:not(.rn){opacity:.35}
.filterbar{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;padding:6px 10px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.filterbar[hidden]{display:none}
.filterbar code,.card code,dialog code{font-family:ui-monospace,monospace;font-size:12px}
.card>header button.copy{padding:2px 9px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
button:disabled:hover{border-color:var(--border)}
.sep{width:1px;align-self:stretch;background:var(--border);margin:0 2px}
table.corr td{text-align:center;line-height:1.2}
table.corr td small{display:block;color:var(--muted);font-size:10.5px}
.note{color:var(--muted);font-size:12.5px;margin:4px 0}
.report{margin-top:10px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:13px}
.warn{margin-top:8px;padding:8px 12px;border-left:3px solid var(--accent2);background:var(--panel2);border-radius:0 6px 6px 0;font-size:13px}
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:8px}
svg.plot{width:100%;max-width:640px;height:auto;display:block}
svg.plot text{fill:var(--muted);font-size:11px;font-family:inherit}
svg.plot .ttl{fill:var(--text);font-weight:600;font-size:12px}
svg.plot .grid{stroke:var(--grid)}
svg.plot .axis{stroke:var(--border)}
svg.plot .bar{fill:var(--accent);opacity:.85}
svg.plot .bar:hover{opacity:1}
svg.plot .pt{fill:var(--accent);fill-opacity:.6;stroke:var(--panel);stroke-width:.8}
svg.plot .line{stroke:var(--accent2);stroke-width:2;fill:none}
svg.plot .ref{stroke:var(--muted);stroke-dasharray:4 4;fill:none}
svg.plot .box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg.plot .med{stroke:var(--accent);stroke-width:2.5}
svg.plot .whisk{stroke:var(--accent);stroke-width:1.3}
svg.plot .out{fill:none;stroke:var(--accent2);stroke-width:1.3}
svg.plot .mean{fill:var(--accent2)}

dialog{border:1px solid var(--border);border-radius:12px;padding:0;background:var(--panel);color:var(--text);width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,20,.45)}
dialog form{display:flex;flex-direction:column;max-height:85vh}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
dialog .db{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
dialog .df{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
dialog label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
dialog label.f>*{font-weight:400}
dialog fieldset{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:0}
dialog legend{font-size:13px;font-weight:600;padding:0 4px}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;max-height:180px;overflow:auto}
label.ck{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400}
.err{color:var(--danger);font-size:13px}
.err:empty{display:none}
.hint{color:var(--muted);font-size:12px;font-weight:400}
textarea.paste{width:100%;min-height:200px;font-family:ui-monospace,monospace;font-size:12px}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:2px;padding:8px}
  .side h4{width:100%;margin:6px 4px 0}
  .side button{width:auto;background:var(--panel2)}
  .top{gap:8px;flex-wrap:wrap}
}
@media print{
  .top,.side,.toolbar,#tab-data,.card .x,.card .copy{display:none!important}
  .app{display:block}
  #tab-results{display:block!important}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>StatBench</div>
  <nav class="tabs">
    <button data-tab="data" class="on">Data</button>
    <button data-tab="results">Results <span class="count" id="rcount"></span></button>
  </nav>
  <div class="spacer"></div>
  <button class="ghost" id="themeBtn" title="Toggle theme">Theme: Auto</button>
</header>

<div class="app">
  <aside class="side" id="side"></aside>
  <main>
    <section id="tab-data">
      <div class="toolbar">
        <button id="bImport">Import CSV…</button>
        <button id="bPaste">Paste data…</button>
        <button id="bSample">Sample data</button>
        <span class="sep"></span>
        <button id="bUndo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
        <button id="bAddRow">+ Row</button>
        <button id="bAddCol">+ Column</button>
        <button id="bCompute">Compute…</button>
        <button id="bRecode">Recode…</button>
        <button id="bSort">Sort…</button>
        <button id="bFilter">Filter…</button>
        <span class="sep"></span>
        <button id="bExport">Export CSV</button>
        <button id="bClear" class="danger">Clear</button>
        <span class="info" id="dataInfo"></span>
        <input type="file" id="file" accept=".csv,.tsv,.txt,text/csv" hidden>
      </div>
      <div class="filterbar" id="filterBar" hidden>Filter active: <code id="filterExpr"></code><span id="filterN"></span><span class="spacer"></span><button id="bFilterOff">Remove filter</button></div>
      <div class="tablewrap" id="tableWrap"></div>
    </section>
    <section id="tab-results" hidden>
      <div class="toolbar">
        <button id="bSaveRes">Export results (HTML)</button>
        <button id="bPrint">Print / PDF</button>
        <button id="bClearRes" class="danger">Clear results</button>
      </div>
      <div id="results"></div>
    </section>
  </main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm">
  <div class="dh" id="dlgTitle"></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><span class="err" id="dlgErr" style="margin-right:auto"></span><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="ok" id="dlgOk">Run</button></div>
</form></dialog>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};

/* ================= Distributions & special functions ================= */
const LG = [0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function lgamma(x){
  if (x < 0.5) return Math.log(Math.PI/Math.abs(Math.sin(Math.PI*x))) - lgamma(1-x);
  x -= 1; let a = LG[0]; const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LG[i]/(x+i);
  return 0.5*Math.log(2*Math.PI) + (x+0.5)*Math.log(t) - t + Math.log(a);
}
const lchoose = (n,k) => lgamma(n+1) - lgamma(k+1) - lgamma(n-k+1);
function betacf(a,b,x){
  const FP = 1e-300; let qab=a+b, qap=a+1, qam=a-1, c=1, d=1-qab*x/qap;
  if (Math.abs(d)<FP) d=FP; d=1/d; let h=d;
  for (let m=1; m<=400; m++){
    const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d;
    const del=d*c; h*=del; if (Math.abs(del-1)<3e-15) break;
  }
  return h;
}
function ibeta(x,a,b){ // regularized incomplete beta I_x(a,b)
  if (!(x>0)) return 0; if (x>=1) return 1;
  const bt = Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x < (a+1)/(a+b+2) ? bt*betacf(a,b,x)/a : 1 - bt*betacf(b,a,1-x)/b;
}
function gammaQ(a,x){ // upper regularized incomplete gamma
  if (!(x>0)) return 1; if (x===Infinity) return 0;
  const lf = -x + a*Math.log(x) - lgamma(a);
  if (x < a+1){
    let ap=a, sum=1/a, del=sum;
    for (let n=0; n<1000; n++){ ap++; del*=x/ap; sum+=del; if (Math.abs(del)<Math.abs(sum)*1e-16) break; }
    return 1 - sum*Math.exp(lf);
  }
  let b=x+1-a, c=1e300, d=1/b, h=d;
  for (let i=1; i<1000; i++){
    const an=-i*(i-a); b+=2; d=an*d+b; if(Math.abs(d)<1e-300)d=1e-300;
    c=b+an/c; if(Math.abs(c)<1e-300)c=1e-300; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<1e-16) break;
  }
  return Math.exp(lf)*h;
}
const Phi = z => z===Infinity?1:z===-Infinity?0: z<0 ? 0.5*gammaQ(0.5,z*z/2) : 1-0.5*gammaQ(0.5,z*z/2);
const normPdf = z => Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
function normInv(p){ // Acklam with one Newton refinement
  if (p<=0) return -Infinity; if (p>=1) return Infinity;
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  let q,r,x;
  if (p<0.02425){ q=Math.sqrt(-2*Math.log(p)); x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  else if (p>1-0.02425){ q=Math.sqrt(-2*Math.log(1-p)); x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  else { q=p-0.5; r=q*q; x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  const e = Phi(x)-p; return x - e*Math.sqrt(2*Math.PI)*Math.exp(x*x/2)/(1+x*e*Math.sqrt(2*Math.PI)*Math.exp(x*x/2)/2);
}
function tcdf(t,df){
  if (t===Infinity) return 1; if (t===-Infinity) return 0;
  const tail = 0.5*ibeta(df/(df+t*t), df/2, 0.5);
  return t>0 ? 1-tail : tail;
}
function tinv(p,df){
  let lo=-1e4, hi=1e4;
  for (let i=0;i<200;i++){ const m=(lo+hi)/2; if (tcdf(m,df)<p) lo=m; else hi=m; }
  return (lo+hi)/2;
}
const fUpper = (F,d1,d2) => F===Infinity?0: F<=0?1: ibeta(d2/(d2+d1*F), d2/2, d1/2);
const chiUpper = (x,k) => x<=0?1: gammaQ(k/2, x/2);
function pFrom(cdf, alt){ // cdf = P(T <= observed)
  if (alt==='greater') return 1-cdf;
  if (alt==='less') return cdf;
  return Math.min(1, 2*Math.min(cdf, 1-cdf));
}
const pT = (t,df,alt) => pFrom(tcdf(t,df), alt);
const pZ = (z,alt) => pFrom(Phi(z), alt);
function ciT(est,se,df,conf,alt){
  if (alt==='greater') return [est - tinv(conf,df)*se, Infinity];
  if (alt==='less') return [-Infinity, est + tinv(conf,df)*se];
  const q = tinv(1-(1-conf)/2, df); return [est-q*se, est+q*se];
}
function holm(ps){
  const m=ps.length, idx=ps.map((p,i)=>i).sort((a,b)=>ps[a]-ps[b]), out=new Array(m); let run=0;
  idx.forEach((i,r)=>{ run=Math.max(run, Math.min(1,(m-r)*ps[i])); out[i]=run; });
  return out;
}
function bisect(fn, target, lo, hi, it=100){ // fn increasing
  for (let i=0;i<it;i++){ const m=(lo+hi)/2; if (fn(m)<target) lo=m; else hi=m; }
  return (lo+hi)/2;
}
const chiInv = (p,k) => bisect(x=>1-chiUpper(x,k), p, 0, k+60*Math.sqrt(2*k)+200);
const betaInv = (p,a,b) => bisect(x=>ibeta(x,a,b), p, 0, 1, 60);
const dbinom = (k,n,p) => Math.exp(lchoose(n,k)+(k?k*Math.log(p):0)+(n-k?(n-k)*Math.log(1-p):0));
function erfcFast(x){ // Numerical Recipes erfcc, |rel err| < 1.2e-7
  const z=Math.abs(x), t=1/(1+0.5*z);
  const r=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(0.37409196+t*(0.09678418+t*(-0.18628806+t*(0.27886807+t*(-1.13520398+t*(1.48851587+t*(-0.82215223+t*0.17087277)))))))));
  return x>=0?r:2-r;
}
const PhiF = z => 0.5*erfcFast(-z/Math.SQRT2);
function simpson(fn,a,b,n){ if (n%2) n++; const h=(b-a)/n; let s=fn(a)+fn(b); for (let i=1;i<n;i++) s+=(i%2?4:2)*fn(a+i*h); return s*h/3; }
const SB=new Map();
function sIntegral(df, g, n=64){ // E[g(s)] where s = sqrt(chi²_df / df)
  if (!Number.isFinite(df) || df>2e4) return g(1);
  const lc=Math.log(2)+(df/2)*Math.log(df/2)-lgamma(df/2);
  if (!SB.has(df)) SB.set(df,[Math.sqrt(chiInv(1e-10,df)/df), Math.sqrt(chiInv(1-1e-10,df)/df)]);
  const [lo,hi]=SB.get(df);

  let s=20240917; const rnd=()=>{ s=(s*1664525+1013904223)%4294967296; return s/4294967296; };
  const nrm=()=>Math.sqrt(-2*Math.log(rnd()+1e-12))*Math.cos(2*Math.PI*rnd());
  const rows=[['id','group','sex','age','height_cm','weight_kg','score_pre','score_post','satisfied']];
  for (let i=1;i<=90;i++){
    const g='ABC'[(i-1)%3], sex=rnd()<0.5?'F':'M', age=Math.round(22+rnd()*40);
    const h=(sex==='M'?176:163)+nrm()*7, w=h*0.42-2+nrm()*8+(age-40)*0.12;
    const pre=60+nrm()*10, post=pre+({A:2,B:6,C:9})[g]+nrm()*6;
    const sat=rnd()< ({A:.4,B:.55,C:.75})[g] ? 'Yes':'No';
    rows.push([i,g,sex,age,h.toFixed(1),w.toFixed(1),pre.toFixed(1),i===17?'':post.toFixed(1),sat]);
  }
  return rows.map(r=>r.map(String));
}

function f(x,d=3){
  if (x==null || Number.isNaN(x)) return '—';
  if (x===Infinity) return '∞'; if (x===-Infinity) return '−∞';
  if (Number.isInteger(x) && d===0) return String(x);
  const ax=Math.abs(x);
  if (ax>=1e7 || (ax<1e-4 && ax!==0)) return x.toExponential(2);
  return x.toFixed(d);
}
const fp = p => p==null||Number.isNaN(p) ? '—' : p<0.001 ? '< .001' : p.toFixed(3).replace(/^0/,'');

function niceTicks(min,max,count=5){
  if (!(max>min)){ min-=1; max+=1; }
  const step0=(max-min)/count, mag=10**Math.floor(Math.log10(step0)), e=step0/mag;
  const step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;
  const lo=Math.floor(min/step+1e-9)*step, hi=Math.ceil(max/step-1e-9)*step, ticks=[];
  for (let v=lo; v<=hi+step*1e-6; v+=step) ticks.push(+v.toPrecision(12));
  return {lo,hi,ticks};
}
const tickFmt = t => Math.abs(t)>=1e5 ? t.toExponential(1) : String(+t.toPrecision(6));
function makePlot({xmin,xmax,ymin,ymax,xlab='',ylab='',title='',cats=null,legend=null,w=600,h=360}){

  const X = cats ? null : niceTicks(xmin,xmax), Y=niceTicks(ymin,ymax);
  const pw=w-m.l-m.r, ph=h-m.t-m.b;
  const sx = cats ? i=>m.l+(i+0.5)*pw/cats.length : v=>m.l+(v-X.lo)/(X.hi-X.lo)*pw;
  const sy = v=>m.t+ph-(v-Y.lo)/(Y.hi-Y.lo)*ph;

  if (legend){ let lx=m.l; const ly=title?38:16; legend.forEach((name,i)=>{ const lab=String(name).length>16?String(name).slice(0,15)+'…':String(name); if (lx>w-60) return; g+=`<rect x="${lx}" y="${ly-8}" width="10" height="10" rx="2" fill="${PAL[i%PAL.length]}"/><text x="${lx+14}" y="${ly+1}">${esc(lab)}</text>`; lx+=24+lab.length*6.3; }); }
  for (const t of Y.ticks) g+=`<line class="grid" x1="${m.l}" x2="${w-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${m.l-7}" y="${sy(t)+4}" text-anchor="end">${tickFmt(t)}</text>`;
  if (cats) cats.forEach((c,i)=>{ const lab=esc(String(c).length>14?String(c).slice(0,13)+'…':c);
      g+= rot ? `<text x="${sx(i)}" y="${h-m.b+14}" text-anchor="end" transform="rotate(-40 ${sx(i)} ${h-m.b+14})">${lab}</text>` : `<text x="${sx(i)}" y="${h-m.b+17}" text-anchor="middle">${lab}</text>`; });
  else for (const t of X.ticks) g+=`<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${m.t}" y2="${m.t+ph}"/><text x="${sx(t)}" y="${h-m.b+17}" text-anchor="middle">${tickFmt(t)}</text>`;
  g+=`<line class="axis" x1="${m.l}" x2="${w-m.r}" y1="${m.t+ph}" y2="${m.t+ph}"/><line class="axis" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${m.t+ph}"/>`;
  if (xlab) g+=`<text x="${m.l+pw/2}" y="${h-8}" text-anchor="middle">${esc(xlab)}</text>`;
  if (ylab) g+=`<text transform="translate(14 ${m.t+ph/2}) rotate(-90)" text-anchor="middle">${esc(ylab)}</text>`;
  return { sx, sy, X, Y, m, pw, ph, wrap: body => `<svg class="plot" viewBox="0 0 ${w} ${h}" role="img">${g}${body}</svg>` };
}
function histSVG(a,{bins,xlab,normal,title}={}){

const ALT={k:'alt',t:'select',label:'Alternative hypothesis',options:[['two','Two-sided (≠)'],['greater','Greater (>)'],['less','Less (<)']]};

function grpStats(sp){ return table(['Group','N','Mean','SD','SE','Median'], sp.map(([k,a])=>{ const s=summary(a); return [esc(k),s.n,f(s.mean),f(s.sd),f(s.se),f(s.median)]; })); }
function twoGroups(o){
  const sp=splitBy(o.y,o.g);
  need(sp.length===2, `"${D.cols[o.g]}" has ${sp.length} levels with data; this test needs exactly 2. Use one-way ANOVA / Kruskal–Wallis for more groups.`);
  need(sp[0][1].length>=2 && sp[1][1].length>=2, 'Each group needs at least 2 observations.');

function buildDesign(rows, xs, ok){ // dummy-codes text predictors (first level = reference)
  const isN=xs.map(colIsNum), S=xs.map((j,k)=>rows.map(r=>isN[k]?toNum(r[j]):(isMiss(r[j])?null:String(r[j]).trim())));
  const idx=[]; rows.forEach((_,i)=>{ if (ok(i) && xs.every((j,k)=>isN[k]?Number.isFinite(S[k][i]):S[k][i]!=null)) idx.push(i); });
  const terms=['(Intercept)'], cols=[];
  xs.forEach((j,k)=>{
    if (isN[k]){ terms.push(cname(j)); cols.push(idx.map(i=>S[k][i])); }
    else { const lv=sortLevels([...new Set(idx.map(i=>S[k][i]))]); for (const L of lv.slice(1)){ terms.push(`${cname(j)} [${esc(L)}]`); cols.push(idx.map(i=>S[k][i]===L?1:0)); } }
  });
  return {idx, terms, cols, X:idx.map((_,r)=>[1,...cols.map(c=>c[r])])};
}
function saveCols(rows, idx, defs){ // defs: [[name, values aligned with idx]]
  snap(); const names=[];
  for (const [name,vals] of defs){
    const nm=uniqueName(name), m=new Map(); idx.forEach((i,r)=>m.set(rows[i], String(+vals[r].toPrecision(10))));
    D.cols.push(nm); D.rows.forEach(r=>r.push(m.get(r)??'')); names.push(nm);
  }
  dataChanged(true); return names;
}
function postHoc(sp, method, A){
  const k=sp.length, G=sp.map(g=>g[1]), rows=[], ps=[];
  if (method==='holm'){
    for (let i=0;i<k;i++) for (let j=i+1;j<k;j++){ const w=welchT(G[i],G[j]), p=pT(w.t,w.df,'two'); ps.push(p); rows.push([`${esc(sp[i][0])} − ${esc(sp[j][0])}`,f(w.diff),f(w.se),f(w.t),f(w.df,2),fp(p)]); }
    holm(ps).forEach((p,i)=>rows[i].push(P(p)));
    return h5('Post hoc: Welch t-tests (Holm-adjusted)')+table(['Comparison','Mean diff.','SE','t','df','p (raw)','p (Holm)'],rows);
  }
  const qc = method==='tukey' ? qtukey(0.95,k,A.dfw) : null;
  for (let i=0;i<k;i++) for (let j=i+1;j<k;j++){
    const a=G[i], b=G[j], diff=mean(a)-mean(b); let se, df;
    if (method==='tukey'){ se=Math.sqrt(A.msw*(1/a.length+1/b.length)); df=A.dfw; }
    else { const va=variance(a)/a.length, vb=variance(b)/b.length; se=Math.sqrt(va+vb); df=(va+vb)**2/(va*va/(a.length-1)+vb*vb/(b.length-1)); }
    const t=diff/se, p=1-ptukey(Math.abs(t)*Math.SQRT2,k,df), q=(qc??qtukey(0.95,k,df))/Math.SQRT2;
    rows.push([`${esc(sp[i][0])} − ${esc(sp[j][0])}`,f(diff),f(se),f(t),method==='gh'?f(df,2):df,P(Math.max(0,p)),ci([diff-q*se,diff+q*se])]);
  }
  return h5(method==='tukey'?'Post hoc: Tukey HSD (Tukey–Kramer)':'Post hoc: Games–Howell')
    + table(['Comparison','Mean diff.','SE','t','df',`p (${method==='tukey'?'Tukey':'Games–Howell'})`,'95% simultaneous CI'],rows);
}

        [`0 (not ${esc(o.ev)})`,tn,fpos,f(100*tn/(n-n1),1)],[`1 (${esc(o.ev)})`,fneg,tp,f(100*tp/n1,1)],['<b>Overall</b>','','',`<b>${f(100*(tp+tn)/n,1)}</b>`]])
      + note(`Outcome coded 1 = "${esc(o.ev)}", 0 = other values. ${rows.length-n} rows excluded for missing values. Converged in ${M.it+1} iterations.`);
    if (!M.conv || M.b.some((b,k)=>Math.abs(b)>12 && ses[k]>50)) out+=warn('The model did not converge cleanly — possible (quasi-)complete separation. Coefficients and SEs may be unreliable.');
    if (o.save){ const nm=saveCols(rows,idx,[[`${D.cols[o.y]}_prob`,M.pr]]); out+=note(`Saved new column: ${esc(nm[0])}.`); }
    return out+`<div class="plots">${lineSVG(fx,[ty,fx],{xlab:'1 − specificity (false positive rate)',ylab:'Sensitivity',title:`ROC curve (AUC = ${f(auc)})`,names:['Model','Chance'],ymin:0,ymax:1,points:false})}</div>`
      + report(`χ²(${dfm}) = ${f(lr,2)}, p ${pAPA(plr)}, Nagelkerke R² = ${f(nag,2)}`);
  }},
prop:{ g:'Categorical', name:'One-sample proportion test',
  fields:[{k:'x',t:'col',label:'Variable',prefCat:true},{k:'ev',t:'level',of:'x',label:'Success value'},{k:'p0',t:'number',label:'Hypothesized proportion (p₀)',def:0.5},ALT,CONF],
  run(o){
    const s=strCol(o.x).filter(v=>v!=null), n=s.length, k=s.filter(v=>v===o.ev).length, p0=o.p0??0.5, conf=o.conf||0.95;
    need(n>0,'No data.'); need(p0>0&&p0<1,'p₀ must be between 0 and 1.');
    const ph=k/n; let pe;
    if (o.alt==='greater'){ pe=0; for (let i=k;i<=n;i++) pe+=dbinom(i,n,p0); }
    else if (o.alt==='less'){ pe=0; for (let i=0;i<=k;i++) pe+=dbinom(i,n,p0); }
    else { const d=dbinom(k,n,p0); pe=0; for (let i=0;i<=n;i++){ const di=dbinom(i,n,p0); if (di<=d*(1+1e-7)) pe+=di; } }
    pe=Math.min(1,pe);
    const zz=(ph-p0)/Math.sqrt(p0*(1-p0)/n), al=1-conf, zq=normInv(1-al/2);
    const cp=[k===0?0:betaInv(al/2,k,n-k+1), k===n?1:betaInv(1-al/2,k+1,n-k)];
    const wc=(ph+zq*zq/(2*n))/(1+zq*zq/n), wh=zq*Math.sqrt(ph*(1-ph)/n+zq*zq/(4*n*n))/(1+zq*zq/n);
    return table(['N','Successes','Proportion','p₀'],[[n,k,f(ph,4),p0]])
      + table(['Test','Statistic','p'],[['Exact binomial test',`k = ${k}`,P(pe)],['z test (normal approximation)',`z = ${f(zz)}`,P(pZ(zz,o.alt))]])
      + table([`${Math.round(conf*100)}% confidence interval`,'Lower','Upper'],[['Clopper–Pearson (exact)',f(cp[0],4),f(cp[1],4)],['Wilson score',f(wc-wh,4),f(wc+wh,4)]])
      + note(`Success = "${esc(o.ev)}". H₁: p ${altText(o.alt,'','').trim()} ${p0}. Confidence intervals are two-sided.`)
      + report(`${k}/${n} = ${f(ph,3)}, exact binomial p ${pAPA(pe)}`);
  }},
mcnemar:{ g:'Categorical', name:'McNemar test (paired)',
  fields:[{k:'x',t:'col',label:'Variable 1 (e.g. before)',prefCat:true},{k:'y',t:'col',label:'Variable 2 (e.g. after)',prefCat:true,nth:1}],
  run(o){
    need(o.x!==o.y,'Choose two different variables.');
    const a=strCol(o.x), b=strCol(o.y), ok=a.map((v,i)=>v!=null&&b[i]!=null);
    const L=sortLevels([...new Set([...a.filter((_,i)=>ok[i]),...b.filter((_,i)=>ok[i])])]);
    need(L.length===2,`Both variables must use the same 2 values (found ${L.length} distinct values: ${L.slice(0,5).map(esc).join(', ')}).`);
    const O=[[0,0],[0,0]]; a.forEach((v,i)=>{ if (ok[i]) O[L.indexOf(v)][L.indexOf(b[i])]++; });
    const B=O[0][1], C=O[1][0], m=B+C, N=O[0][0]+O[1][1]+m;
    let pe=0; for (let i=0;i<=Math.min(B,C);i++) pe+=dbinom(i,m,0.5); pe=m?Math.min(1,2*pe):1;
    const x2=m?(B-C)**2/m:NaN, x2c=m?(Math.max(0,Math.abs(B-C)-1))**2/m:NaN;
    return table([`${cname(o.x)} \\ ${cname(o.y)}`,esc(L[0]),esc(L[1]),'Total'],[[`<b>${esc(L[0])}</b>`,O[0][0],B,O[0][0]+B],[`<b>${esc(L[1])}</b>`,C,O[1][1],C+O[1][1]],['<b>Total</b>',O[0][0]+C,B+O[1][1],N]])
      + table(['Test','Value','df','p'],[['McNemar χ²',f(x2),1,P(chiUpper(x2,1))],['McNemar χ² (continuity-corrected)',f(x2c),1,P(chiUpper(x2c,1))],['Exact binomial test','','',P(pe)]])
      + note(`${m} discordant pairs (${B} changed ${esc(L[0])} → ${esc(L[1])}, ${C} changed ${esc(L[1])} → ${esc(L[0])}). Exact test recommended when discordant pairs < 25.`)
      + report(`McNemar χ²(1, N = ${N}) = ${f(x2c,2)}, p ${pAPA(chiUpper(x2c,1))}`);
  }},
alpha:{ g:'Scales & factors', name:"Reliability (Cronbach's α)",
  fields:[{k:'vars',t:'nums',label:'Scale items (≥ 2)'}],
  run(o){
    need(o.vars.length>=2,'Select at least 2 items.');
    const C=o.vars.map(numCol), k=C.length, M=C[0].map((_,i)=>C.map(c=>c[i])).filter(r=>r.every(Number.isFinite)), n=M.length;
    need(n>=3,'Need at least 3 complete cases.');
    const item=j=>M.map(r=>r[j]), v=o.vars.map((_,j)=>variance(item(j))), tot=M.map(sum), vt=variance(tot);
    const al=k/(k-1)*(1-sum(v)/vt);
    const rs=[]; for (let a=0;a<k;a++) for (let b=a+1;b<k;b++) rs.push(pearson(item(a),item(b)));
    const rbar=mean(rs), ast=k*rbar/(1+(k-1)*rbar);
    const rows=o.vars.map((jj,j)=>{ const it=item(j), rest=tot.map((t,i)=>t-it[i]);
      const ad=k>2?(k-1)/(k-2)*(1-(sum(v)-v[j])/variance(rest)):NaN;
      return [cname(jj),f(mean(it)),f(sd(it)),f(pearson(it,rest)),f(ad)]; });
    const lab=al>=0.9?'excellent':al>=0.8?'good':al>=0.7?'acceptable':al>=0.6?'questionable':al>=0.5?'poor':'unacceptable';
    let out=table(["Cronbach's α",'Standardized α','Items','N','Mean inter-item r'],[[`<b>${f(al)}</b>`,f(ast),k,n,f(rbar)]])
      + h5('Item statistics')+table(['Item','Mean','SD','Corrected item–total r','α if item deleted'],rows)
      + note(`Rule of thumb: α ≥ .9 excellent, ≥ .8 good, ≥ .7 acceptable, ≥ .6 questionable, ≥ .5 poor. ${AR().length-n} rows excluded for missing values.`);
    if (rows.some(r=>parseFloat(r[3])<0)) out+=warn('Some items correlate negatively with the rest of the scale — they may need reverse-scoring (use Compute, e.g. 6 - item).');
    return out+report(`Cronbach's α = ${f(al,2)} (${lab}), ${k} items, N = ${n}`);
  }},
pca:{ g:'Scales & factors', name:'Principal component analysis',
  fields:[{k:'vars',t:'nums',label:'Variables (≥ 3 recommended)'},{k:'ncomp',t:'number',label:'Components to extract',ph:'auto (eigenvalue > 1)'},{k:'rot',t:'select',label:'Rotation',options:[['varimax','Varimax'],['none','None (unrotated)']]},{k:'save',t:'check',label:'Save component scores as new columns'}],
  run(o){
    need(o.vars.length>=2,'Select at least 2 variables.');
    const rows=AR(), C=o.vars.map(numCol), p=C.length, idx=C[0].map((_,i)=>i).filter(i=>C.every(c=>Number.isFinite(c[i]))), n=idx.length;
    need(n>p,`Need more complete cases (${n}) than variables (${p}).`);
    const mu=C.map(c=>mean(idx.map(i=>c[i]))), sg=C.map((c,j)=>sd(idx.map(i=>c[i])));
    need(sg.every(s=>s>0),'A selected variable has zero variance.');
    const Z=idx.map(i=>C.map((c,j)=>(c[i]-mu[j])/sg[j]));
    const R=[...Array(p)].map((_,a)=>[...Array(p)].map((_,b)=>sum(Z.map(r=>r[a]*r[b]))/(n-1)));
    const {values,vectors}=jacobiEig(R);
    const m=o.ncomp>0?Math.min(p,Math.round(o.ncomp)):Math.max(1,values.filter(v=>v>1).length);
    let L=o.vars.map((_,i)=>[...Array(m)].map((_,c)=>vectors[i][c]*Math.sqrt(Math.max(0,values[c]))));
    const rotated=o.rot==='varimax'&&m>1; if (rotated) L=varimax(L);
    const ss=[...Array(m)].map((_,c)=>sum(L.map(r=>r[c]**2))), ordc=ss.map((_,c)=>c).sort((a,b)=>ss[b]-ss[a]);
    L=L.map(r=>ordc.map(c=>r[c]));
    for (let c=0;c<m;c++) if (sum(L.map(r=>r[c]))<0) L.forEach(r=>{ r[c]=-r[c]; });
    const ssl=ordc.map(c=>ss[c]), Ri=matInv(R);
    let kmo=NaN; if (Ri){ let r2=0,a2=0; for (let i=0;i<p;i++) for (let j=0;j<p;j++) if (i!==j){ r2+=R[i][j]**2; a2+=(Ri[i][j]/Math.sqrt(Ri[i][i]*Ri[j][j]))**2; } kmo=r2/(r2+a2); }
    const ldet=sum(values.map(v=>Math.log(Math.max(v,1e-300)))), bchi=-(n-1-(2*p+5)/6)*ldet, bdf=p*(p-1)/2;
    let cum=0;
    const comp=c=>`${rotated?'RC':'PC'}${c+1}`;
    let out=h5('Suitability')+table(['KMO measure of sampling adequacy',"Bartlett's χ²",'df','p'],[[f(kmo),f(bchi),bdf,P(chiUpper(bchi,bdf))]])
      + h5('Eigenvalues')+table(['Component','Eigenvalue','% of variance','Cumulative %'],values.map((v,c)=>{ cum+=v; return [`${c<m?'<b>':''}PC${c+1}${c<m?'</b>':''}`,f(v),f(100*v/p,2),f(100*cum/p,2)]; }))
      + h5(`Loadings (${m} component${m>1?'s':''}${rotated?', varimax rotation':''})`)
      + `<table class="res"><thead><tr><th>Variable</th>${[...Array(m)].map((_,c)=>`<th>${comp(c)}</th>`).join('')}<th>Communality</th></tr></thead><tbody>`
      + o.vars.map((j,i)=>`<tr><td>${cname(j)}</td>${L[i].map(v=>`<td class="${Math.abs(v)>=0.4?'hi':''}">${f(v)}</td>`).join('')}<td>${f(sum(L[i].map(v=>v*v)))}</td></tr>`).join('')
      + `<tr><td><i>SS loadings</i></td>${ssl.map(v=>`<td>${f(v)}</td>`).join('')}<td></td></tr><tr><td><i>% of variance</i></td>${ssl.map(v=>`<td>${f(100*v/p,2)}</td>`).join('')}<td></td></tr></tbody></table>`
      + note('Analysis of the correlation matrix (standardized variables). Loadings with |value| ≥ 0.40 are bold. KMO ≥ .6 and a significant Bartlett test suggest the data are suitable.');
    if (o.save){ need(Ri,'Cannot compute scores: the correlation matrix is singular.');
      const W=o.vars.map((_,a)=>[...Array(m)].map((_,c)=>sum(o.vars.map((_,b)=>Ri[a][b]*L[b][c]))));
      const sc=[...Array(m)].map((_,c)=>Z.map(z=>sum(z.map((v,a)=>v*W[a][c]))));
      const nm=saveCols(rows,idx,sc.map((v,c)=>[comp(c),v])); out+=note(`Saved component scores (regression method): ${nm.map(esc).join(', ')}.`); }
    return out+`<div class="plots">${lineSVG(values.map((_,i)=>i+1),[values],{xlab:'Component',ylab:'Eigenvalue',title:'Scree plot',hline:1,ymin:0})}</div>`;
  }},
power:{ g:'Planning', name:'Power & sample size', noData:true,
  fields:[{k:'test',t:'select',label:'Test',options:[['t2','Independent-samples t-test'],['t1','One-sample or paired t-test'],['r','Correlation (Pearson r)']]},
    {k:'solve',t:'select',label:'Calculate',options:[['n','Required sample size'],['power','Power for a given sample size']]},
    {k:'es',t:'number',label:"Effect size (Cohen's d; r for correlation)",def:0.5},
    {k:'alpha',t:'number',label:'Significance level (α)',def:0.05},
    {k:'tails',t:'select',label:'Tails',options:[['2','Two-sided'],['1','One-sided']]},
    {k:'pw',t:'number',label:'Target power (when calculating sample size)',def:0.8},
    {k:'n',t:'number',label:'Sample size — per group for independent t (when calculating power)',def:30}],
  run(o){
    const es=Math.abs(o.es??0), a=o.alpha, tails=+o.tails, isR=o.test==='r';
    need(es>0,'Effect size must be non-zero.'); need(!isR||es<1,'r must be between −1 and 1.'); need(a>0&&a<0.5,'α must be between 0 and 0.5.');
    const pow=n=>{
      if (isR){ if (n<4) return 0; const z=Math.atanh(es)*Math.sqrt(n-3), zc=normInv(1-a/tails); return tails===2?Phi(z-zc)+Phi(-z-zc):Phi(z-zc); }
      const df=o.test==='t2'?2*n-2:n-1; if (df<1) return 0; const dl=es*Math.sqrt(o.test==='t2'?n/2:n);
      if (tails===2){ const tc=tinv(1-a/2,df); return 1-nctcdf(tc,df,dl)+nctcdf(-tc,df,dl); }
      return 1-nctcdf(tinv(1-a,df),df,dl);
    };
    let n;
    if (o.solve==='n'){
      need(o.pw>a&&o.pw<1,'Target power must be between α and 1.');
      let lo=isR?4:2, hi=lo; while (pow(hi)<o.pw){ lo=hi; hi*=2; need(hi<5e6,'Required sample size is too large.'); }
      while (hi-lo>1){ const mid=Math.floor((lo+hi)/2); if (pow(mid)>=o.pw) hi=mid; else lo=mid; }
      n=pow(lo)>=o.pw?lo:hi;
    } else { n=Math.round(o.n??0); need(n>=(isR?4:2),'Sample size is too small.'); }
    const pw=pow(n), lab=o.test==='t2'?'n per group':'N', tot=o.test==='t2'?2*n:n;
    const ns=[]; const top=Math.max(n*2,10); for (let i=0;i<=40;i++){ const v=Math.max(isR?4:2,Math.round(top*i/40)); if (!ns.includes(v)) ns.push(v); }
    return table(['Test','Effect size','α','Tails',lab,'Total N','Power'],[[({t2:'Independent t',t1:'One-sample / paired t',r:'Correlation'})[o.test],f(es,3),a,tails,`<b>${n}</b>`,tot,`<b>${f(pw,4)}</b>`]])
      + note(isR?'Uses the Fisher z approximation. Conventions: r = 0.1 small, 0.3 medium, 0.5 large.':"Exact power from the noncentral t distribution. Conventions: d = 0.2 small, 0.5 medium, 0.8 large.")
      + `<div class="plots">${lineSVG(ns,[ns.map(pow)],{xlab:lab,ylab:'Power',title:'Power curve',hline:o.solve==='n'?o.pw:null,ymin:0,ymax:1,points:false})}</div>`
      + report(o.solve==='n'?`To detect ${isR?'r':'d'} = ${f(es,2)} with ${Math.round(o.pw*100)}% power at α = ${a} (${tails===2?'two':'one'}-sided), you need ${lab} = ${n}${o.test==='t2'?` (total ${tot})`:''}.`:`With ${lab} = ${n}, power = ${f(pw,3)}.`);
  }},
};

/* ================= Dialogs ================= */
const dlg=$('#dlg');
let dlgHandler=null;
function openDialog(title, bodyHTML, okLabel, onOk){
  $('#dlgTitle').textContent=title; $('#dlgBody').innerHTML=bodyHTML; $('#dlgErr').textContent=''; $('#dlgOk').textContent=okLabel;
  dlgHandler=onOk; dlg.showModal();
  const first=$('#dlgBody').querySelector('select,input,textarea'); if (first) first.focus();
}
$('#dlgForm').addEventListener('submit', e=>{
  if (e.submitter && e.submitter.value==='cancel') return;
  e.preventDefault();
  try { dlgHandler(); dlg.close(); }
  catch(err){ $('#dlgErr').textContent=err.message; console.error(err); }
});
function fieldHTML(fd){
  const all=D.cols.map((c,j)=>[j,c]), nums=all.filter(([j])=>colIsNum(j));
  const opts=(list,sel)=>list.map(([j,c])=>`<option value="${j}"${j===sel?' selected':''}>${esc(c)}</option>`).join('');
  const pick=(list)=>{ let l=list; if (fd.prefCat){ const cats=list.filter(([j])=>!colIsNum(j)); if (cats.length) l=[...cats,...list.filter(([j])=>colIsNum(j))]; } return (l[fd.nth||0]||l[0]||[-1])[0]; };
  switch (fd.t){
    case 'num': return `<label class="f">${fd.label}<select name="${fd.k}">${opts(nums,pick(nums))}</select></label>`;
    case 'col': return `<label class="f">${fd.label}<select name="${fd.k}">${fd.optional?'<option value="-1">— none —</option>':''}${opts(all,fd.optional?-2:pick(all))}</select></label>`;
    case 'nums': case 'cols': { const list=fd.t==='nums'?nums:all;
      return `<fieldset><legend>${fd.label}</legend><div class="checks">${list.map(([j,c])=>`<label class="ck"><input type="checkbox" name="${fd.k}" value="${j}">${esc(c)}${fd.t==='cols'&&!colIsNum(j)?' <span class="badge t">abc</span>':''}</label>`).join('')||'<span class="hint">No suitable columns.</span>'}</div></fieldset>`; }
    case 'number': return `<label class="f">${fd.label}<input type="number" step="any" name="${fd.k}" value="${fd.def??''}" placeholder="${fd.ph||''}"></label>`;
    case 'select': return `<label class="f">${fd.label}<select name="${fd.k}">${fd.options.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label>`;
    case 'check': return `<label class="ck"><input type="checkbox" name="${fd.k}"${fd.def?' checked':''}>${fd.label}</label>`;
    case 'level': return `<label class="f">${fd.label}<select name="${fd.k}" data-of="${fd.of}"></select></label>`;
  }
}
function readForm(fields){
  const F=$('#dlgForm'), o={};
  for (const fd of fields){
    if (fd.t==='nums'||fd.t==='cols') o[fd.k]=[...F.querySelectorAll(`input[name="${fd.k}"]:checked`)].map(e=>+e.value);
    else if (fd.t==='check') o[fd.k]=F.elements[fd.k].checked;
    else if (fd.t==='number'){ const v=F.elements[fd.k].value; o[fd.k]=v===''?null:+v; }
    else if (fd.t==='num'||fd.t==='col'){ o[fd.k]=+F.elements[fd.k].value; need(fd.optional||o[fd.k]>=0,`Choose a ${fd.label.toLowerCase()}.`); }
    else o[fd.k]=F.elements[fd.k].value;
  }
  return o;
}
function openAnalysis(key){
  const A=AN[key];
  if (!A.noData && !D.cols.length){ alert('Load or enter some data first (Data tab).'); return; }
  if (!A.noData && A.fields.some(fd=>fd.t==='num'||fd.t==='nums') && !D.cols.some((_,j)=>colIsNum(j))){ alert('This analysis needs at least one numeric column.'); return; }
  openDialog(A.name, A.fields.map(fieldHTML).join(''), 'Run', ()=>{
    const o=readForm(A.fields);
    if (o.conf!=null) need(o.conf>0&&o.conf<1,'Confidence level must be between 0 and 1 (e.g. 0.95).');
    addResult(A.name, A.run(o), !A.noData);
  });
  for (const sel of $('#dlgBody').querySelectorAll('select[data-of]')){ // value pickers that follow a column choice
    const src=$('#dlgForm').elements[sel.dataset.of];
    const fill=()=>{ const lv=sortLevels([...new Set(strCol(+src.value).filter(v=>v!=null))]);
      sel.innerHTML=lv.slice(0,300).map(v=>`<option>${esc(v)}</option>`).join(''); if (lv.length) sel.value=lv.includes('Yes')?'Yes':lv.includes('1')?'1':lv[lv.length-1]; };
    src.addEventListener('change',fill); fill();
  }
}
function openPaste(){
  openDialog('Paste data', `<span class="hint">Paste from Excel, Google Sheets or a CSV/TSV file. The delimiter is detected automatically.</span>
    <textarea class="paste" name="txt" placeholder="name,age,score&#10;Ann,34,81&#10;Bo,29,77"></textarea>
    <label class="ck"><input type="checkbox" name="hdr" checked>First row contains column names</label>`, 'Load', ()=>{
    const F=$('#dlgForm'), rows=parseCSV(F.elements.txt.value); need(rows.length,'Nothing to load.');
    loadTable(rows, F.elements.hdr.checked);
  });
}
function openCompute(){
  need2();
  openDialog('Compute new column', `<label class="f">New column name<input name="nm" value="${uniqueName('computed')}"></label>
    <label class="f">Expression<input name="ex" placeholder="e.g. weight_kg / (height_cm/100)**2" autocomplete="off"></label>
    <span class="hint">Evaluated for each row. ${varHint()} Use <code>cond ? a : b</code> for conditions. Missing values give empty cells.</span>`, 'Compute', ()=>{
    const F=$('#dlgForm'), ex=F.elements.ex.value.trim(); need(ex,'Enter an expression.');
    const fn=compileExpr(ex);
    const out=D.rows.map(r=>{
      const res=fn(r);
      if (res==null || (typeof res==='number' && !Number.isFinite(res))) return '';
      if (typeof res==='boolean') return res?'1':'0';
      return typeof res==='number' ? String(+res.toPrecision(12)) : String(res);
    });
    snap(); D.cols.push(uniqueName(F.elements.nm.value.trim()||'computed')); D.rows.forEach((r,i)=>r.push(out[i])); dataChanged(true);
  });
}
const varHint = () => `Variables: ${exprIds().map(i=>`<code>${esc(i)}</code>`).join(', ')}. Functions: log, ln, log10, exp, sqrt, abs, round, floor, ceil, min, max, pow, isNA(x)…`;
function openFilter(){
  need2();
  openDialog('Filter rows (select cases)', `<label class="f">Keep rows where<input name="ex" value="${esc(D.filter||'')}" placeholder="e.g. age >= 30 && sex == 'F'" autocomplete="off"></label>
    <span class="hint">Analyses use only rows where the expression is true; other rows are dimmed in the grid. Leave empty to remove the filter. ${varHint()}</span>`, 'Apply', ()=>{
    const ex=$('#dlgForm').elements.ex.value.trim();

    snap(); D.filter=ex||undefined; dataChanged(true);

}
function openSort(){
  need2();
  openDialog('Sort rows', `<label class="f">Sort by<select name="c">${D.cols.map((c,j)=>`<option value="${j}">${esc(c)}</option>`).join('')}</select></label>
    <label class="f">Order<select name="o"><option value="1">Ascending</option><option value="-1">Descending</option></select></label>`, 'Sort', ()=>{
    const F=$('#dlgForm'), j=+F.elements.c.value, dir=+F.elements.o.value, num=colIsNum(j);
    snap();
    D.rows.sort((a,b)=>{ const ma=isMiss(a[j]), mb=isMiss(b[j]); if (ma||mb) return ma-mb;
      return dir*(num ? toNum(a[j])-toNum(b[j]) : String(a[j]).localeCompare(String(b[j]),undefined,{numeric:true})); });
    dataChanged(true);
  });
}
function openRecode(){
  need2();
  openDialog('Recode values', `<label class="f">Source column<select name="c">${D.cols.map((c,j)=>`<option value="${j}">${esc(c)}</option>`).join('')}</select></label>
    <label class="f">Rules (one per line)<textarea name="rules" rows="6" style="font-family:ui-monospace,monospace;font-size:12px" placeholder="M = Male&#10;F = Female&#10;18 - 29.999 = young&#10;30 - highest = older&#10;else = other"></textarea></label>
    <span class="hint"><code>old = new</code> for exact values; <code>lo - hi = new</code> for numeric ranges (inclusive; <code>lowest</code>/<code>highest</code> allowed); <code>else = new</code> for everything else. Missing values stay missing.</span>
    <label class="f">New column name<input name="nm" placeholder="(defaults to source name + _r)"></label>
    <label class="ck"><input type="checkbox" name="keep" checked>Keep unmatched values unchanged (when no <code>else</code> rule)</label>`, 'Recode', ()=>{
    const F=$('#dlgForm'), j=+F.elements.c.value, rules=[]; let other=null;
    for (const line of F.elements.rules.value.split('\n')){
      const t=line.trim(); if (!t) continue;
      const eq=t.lastIndexOf('='); need(eq>0,`Rule "${t}" needs an "=".`);
      const lhs=t.slice(0,eq).trim(), rhs=t.slice(eq+1).trim();
      const rg=lhs.match(/^(lowest|-?[\d.]+(?:e-?\d+)?)\s+-\s+(highest|-?[\d.]+(?:e-?\d+)?)$/i);
      if (/^else$/i.test(lhs)) other=rhs;
      else if (rg) rules.push({lo:/lowest/i.test(rg[1])?-Infinity:+rg[1], hi:/highest/i.test(rg[2])?Infinity:+rg[2], v:rhs});
      else rules.push({eq:lhs, v:rhs});
    }
    need(rules.length||other!=null,'Enter at least one rule.');
    const keep=F.elements.keep.checked;
    const out=D.rows.map(r=>{ const x=r[j]; if (isMiss(x)) return ''; const s=String(x).trim(), n=toNum(x);
      for (const R of rules){ if (R.eq!=null ? R.eq===s : (Number.isFinite(n) && n>=R.lo && n<=R.hi)) return R.v; }
      return other!=null ? other : keep ? s : ''; });
    snap(); D.cols.push(uniqueName(F.elements.nm.value.trim()||`${D.cols[j]}_r`)); D.rows.forEach((r,i)=>r.push(out[i])); dataChanged(true);
  });
}
function need2(){ if (!D.cols.length){ alert('Load some data first.'); throw new Error('no data'); } }

/* ================= Results ================= */
function addResult(title, html, useData=true){
  const el=document.createElement('article'); el.className='card';
  const flt = useData && D.filter && MASK ? `Filter: <code>${esc(D.filter)}</code> (n = ${MASK.filter(Boolean).length}) · ` : '';
  el.innerHTML=`<header><h3>${esc(title)}</h3><span class="meta">${flt}${new Date().toLocaleString()}</span><button class="copy" title="Copy tables as tab-separated text (paste into Excel/Word)">Copy</button><button class="x" title="Remove">×</button></header><div class="body">${html}</div>`;
  $('#results').prepend(el); saveResults(); showTab('results'); window.scrollTo({top:0});
}
$('#results').addEventListener('click', e=>{
  if (e.target.matches('.card>header .x')){ e.target.closest('.card').remove(); saveResults(); }
  else if (e.target.matches('.card>header .copy')){
    const card=e.target.closest('.card'), parts=[card.querySelector('h3').textContent];
    for (const el of card.querySelectorAll('.body > h5, .body > table, .body > .note, .body > .report, .body > .warn')){
      if (el.tagName==='TABLE') parts.push([...el.rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/\s*\n\s*/g,' ').trim()).join('\t')).join('\n'));
      else parts.push(el.innerText.trim());
    }
    const txt=parts.join('\n\n'), btn=e.target;
    const done=()=>{ btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent='Copy',1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done,()=>alert('Clipboard not available.'));
  }
});
function saveResults(){ $('#rcount').textContent=$('#results').children.length||''; store.set('statbench.results', $('#results').innerHTML); }
$('#bClearRes').onclick=()=>{ if ($('#results').children.length && confirm('Remove all results?')){ $('#results').innerHTML=''; saveResults(); } };
$('#bPrint').onclick=()=>window.print();
$('#bSaveRes').onclick=()=>{
  const css=document.querySelector('style').textContent, theme=document.documentElement.dataset.theme||'';
  download('statbench-results.html', `<!doctype html><html lang="en"${theme?` data-theme="${theme}"`:''}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StatBench results</title><style>${css} main{max-width:980px;margin:0 auto}.card .x,.card .copy{display:none}</style></head><body><main><div id="results">${$('#results').innerHTML}</div></main></body></html>`, 'text/html');
};

/* ================= Shell ================= */
function showTab(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  $('#tab-data').hidden = t!=='data'; $('#tab-results').hidden = t!=='results';
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
(function buildSide(){
  const groups=new Map();
  for (const [k,A] of Object.entries(AN)){ if (!groups.has(A.g)) groups.set(A.g,[]); groups.get(A.g).push(`<button data-an="${k}">${A.name}</button>`); }
  $('#side').innerHTML=[...groups].map(([g,b])=>`<h4>${g}</h4>${b.join('')}`).join('');
  $('#side').addEventListener('click', e=>{ const b=e.target.closest('[data-an]'); if (b) openAnalysis(b.dataset.an); });
})();
const THEMES=['auto','light','dark'];
function applyTheme(t){
  if (t==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t;
  $('#themeBtn').textContent = 'Theme: '+t[0].toUpperCase()+t.slice(1); store.set('statbench.theme',t);
}
$('#themeBtn').onclick=()=>applyTheme(THEMES[(THEMES.indexOf(store.get('statbench.theme')||'auto')+1)%3]);
applyTheme(store.get('statbench.theme')||'auto');
try { const s=JSON.parse(store.get('statbench.data')||'null'); if (s && Array.isArray(s.cols) && Array.isArray(s.rows)) D=s; } catch {}
const savedRes=store.get('statbench.results'); if (savedRes) $('#results').innerHTML=savedRes;
saveResults(); dataChanged(true);
</script>
