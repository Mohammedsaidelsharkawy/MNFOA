<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StatBench</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel2:#f0f2f5;--text:#1b1f24;--muted:#5d6670;--border:#dde1e6;
  --accent:#2563eb;--accent-soft:#e3ebfd;--accent2:#d9480f;--sig:#0f7b3f;--danger:#c92a2a;--grid:#e8ebef;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101317;--panel:#171b21;--panel2:#1f242b;--text:#e5e8ec;--muted:#98a2ad;--border:#2b323a;
  --accent:#6d9cff;--accent-soft:#1d2942;--accent2:#ff8a4c;--sig:#4cc38a;--danger:#ff6b6b;--grid:#252b32;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101317;--panel:#171b21;--panel2:#1f242b;--text:#e5e8ec;--muted:#98a2ad;--border:#2b323a;
  --accent:#6d9cff;--accent-soft:#1d2942;--accent2:#ff8a4c;--sig:#4cc38a;--danger:#ff6b6b;--grid:#252b32;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ghost{background:transparent;border-color:transparent}
button.danger:hover{border-color:var(--danger);color:var(--danger)}
input,select,textarea{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}

.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--accent)}
.tabs{display:flex;gap:4px}
.tabs button{border:none;background:transparent;padding:6px 14px;border-radius:7px;color:var(--muted)}
.tabs button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.spacer{flex:1}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
.count:empty{display:none}

.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 53px)}
.side{background:var(--panel);border-right:1px solid var(--border);padding:12px 10px;overflow:auto}
.side h4{margin:14px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.side h4:first-child{margin-top:2px}
.side button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:6px 10px;border-radius:6px}
.side button:hover{background:var(--panel2)}
main{min-width:0;padding:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .info{color:var(--muted);margin-left:auto;font-size:13px}

.tablewrap{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:calc(100vh - 140px);box-shadow:var(--shadow)}
table.data{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
table.data th,table.data td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:0}
table.data thead th{position:sticky;top:0;background:var(--panel2);z-index:2}
table.data .rn{position:sticky;left:0;background:var(--panel2);color:var(--muted);font-size:12px;text-align:right;padding:0 6px;min-width:46px;z-index:1}
table.data thead .rn{z-index:3}
table.data td input{border:none;border-radius:0;background:transparent;width:120px;padding:5px 8px}
table.data td input:focus{outline:2px solid var(--accent);background:var(--accent-soft)}
.colhead{display:flex;align-items:center;gap:4px;padding:4px 4px 4px 6px}
.colhead input{width:104px;font-weight:600;border:1px solid transparent;background:transparent;padding:3px 4px}
.colhead input:hover{border-color:var(--border)}
.badge{font-size:10px;padding:1px 5px;border-radius:4px;font-weight:600;font-family:ui-monospace,monospace}
.badge.n{background:var(--accent-soft);color:var(--accent)}
.badge.t{background:var(--panel);color:var(--accent2);border:1px solid var(--border)}
.x{border:none;background:transparent;color:var(--muted);padding:0 5px;font-size:15px;line-height:1}
.x:hover{color:var(--danger)}
.rn .x{visibility:hidden;margin-right:2px}
tr:hover .rn .x{visibility:visible}
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);margin:0 0 6px;font-size:20px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}

#results{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.card>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel2)}
.card>header h3{margin:0;font-size:15px}
.card>header .meta{color:var(--muted);font-size:12px;margin-left:auto}
.card .body{padding:14px;overflow-x:auto}
.card h5{margin:16px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.card h5:first-child{margin-top:0}
table.res{border-collapse:collapse;margin:2px 0 10px;font-variant-numeric:tabular-nums;font-size:13px}
table.res th,table.res td{padding:5px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
table.res th{font-weight:600;border-bottom:2px solid var(--text);vertical-align:bottom}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res tr:last-child td{border-bottom:2px solid var(--text)}
table.res .sub{font-weight:400;font-size:11px;color:var(--muted)}
td.sig{color:var(--sig);font-weight:600}
td.hi{font-weight:700}
table.data tr.off td:not(.rn){opacity:.35}
.filterbar{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;padding:6px 10px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.filterbar[hidden]{display:none}
.filterbar code,.card code,dialog code{font-family:ui-monospace,monospace;font-size:12px}
.card>header button.copy,.card>header button.mv{padding:2px 9px;font-size:12px}
.card [contenteditable="true"]{border-radius:4px;outline:1px dashed transparent;outline-offset:2px}
.card [contenteditable="true"]:hover{outline-color:var(--border)}
.card [contenteditable="true"]:focus{outline:2px solid var(--accent)}
svg.consort .cb,svg.consort .cl{fill:var(--panel);stroke:var(--text);stroke-width:1.1}
svg.consort .cp{fill:var(--accent-soft);stroke:var(--accent)}
svg.consort .ca{stroke:var(--text);stroke-width:1.2;fill:none}
svg.consort .ca2{stroke:var(--text);stroke-width:1.2;fill:none}
svg.consort text{fill:var(--text);font-size:11.5px}
button:disabled{opacity:.45;cursor:default}
button:disabled:hover{border-color:var(--border)}
.pw{position:relative}
.pw .dlbar{position:absolute;top:4px;right:4px;display:none;gap:4px}
.pw:hover .dlbar{display:flex}
@media (hover:none){.pw .dlbar{display:flex;opacity:.8}}
.dlbar button{padding:2px 8px;font-size:11px}
.sep{width:1px;align-self:stretch;background:var(--border);margin:0 2px}
table.corr td{text-align:center;line-height:1.2}
table.corr td small{display:block;color:var(--muted);font-size:10.5px}
.note{color:var(--muted);font-size:12.5px;margin:4px 0}
table.rpt{border-collapse:collapse;margin:4px 0 8px;font-variant-numeric:tabular-nums;font-size:13px}
table.rpt th,table.rpt td{border:1px solid var(--muted);padding:5px 12px;text-align:center;vertical-align:middle}
table.rpt th{background:var(--panel2);font-weight:700}
.caption{font-weight:700;margin:14px 0 6px}
.para{text-indent:2em;line-height:1.65;text-align:justify;max-width:85ch;margin:6px 0}
.report{margin-top:10px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:13px}
.warn{margin-top:8px;padding:8px 12px;border-left:3px solid var(--accent2);background:var(--panel2);border-radius:0 6px 6px 0;font-size:13px}
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:8px}
svg.plot{width:100%;max-width:640px;height:auto;display:block}
svg.plot text{fill:var(--muted);font-size:11px;font-family:inherit}
svg.plot .ttl{fill:var(--text);font-weight:600;font-size:12px}
svg.plot .grid{stroke:var(--grid)}
svg.plot .axis{stroke:var(--border)}
svg.plot .bar{fill:var(--accent);opacity:.85}
svg.plot .bar:hover{opacity:1}
svg.plot .pt{fill:var(--accent);fill-opacity:.6;stroke:var(--panel);stroke-width:.8}
svg.plot .line{stroke:var(--accent2);stroke-width:2;fill:none}
svg.plot .ref{stroke:var(--muted);stroke-dasharray:4 4;fill:none}
svg.plot .box{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg.plot .med{stroke:var(--accent);stroke-width:2.5}
svg.plot .whisk{stroke:var(--accent);stroke-width:1.3}
svg.plot .out{fill:none;stroke:var(--accent2);stroke-width:1.3}
svg.plot .mean{fill:var(--accent2)}

dialog{border:1px solid var(--border);border-radius:12px;padding:0;background:var(--panel);color:var(--text);width:min(520px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,20,.45)}
dialog form{display:flex;flex-direction:column;max-height:85vh}
dialog .dh{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
dialog .db{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
dialog .df{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
dialog label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
dialog label.f>*{font-weight:400}
dialog fieldset{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:0}
dialog legend{font-size:13px;font-weight:600;padding:0 4px}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;max-height:180px;overflow:auto}
label.ck{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400}
.err{color:var(--danger);font-size:13px}
.err:empty{display:none}
.hint{color:var(--muted);font-size:12px;font-weight:400}
textarea.paste{width:100%;min-height:200px;font-family:ui-monospace,monospace;font-size:12px}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{border-right:none;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:2px;padding:8px}
  .side h4{width:100%;margin:6px 4px 0}
  .side button{width:auto;background:var(--panel2)}
  .top{gap:8px;flex-wrap:wrap}
}
@media print{
  .top,.side,.toolbar,#tab-data,.card .x,.card .copy,.card .mv,.dlbar{display:none!important}
  .app{display:block}
  #tab-results{display:block!important}
  .card{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>StatBench</div>
  <nav class="tabs">
    <button data-tab="data" class="on">Data</button>
    <button data-tab="results">Results <span class="count" id="rcount"></span></button>
  </nav>
  <div class="spacer"></div>
  <button class="ghost" id="bSaveProj" title="Save data and results to a .statbench.json file">Save project</button>
  <button class="ghost" id="bOpenProj" title="Open a saved project file">Open project</button>
  <input type="file" id="projFile" accept=".json,application/json" hidden>
  <button class="ghost" id="themeBtn" title="Toggle theme">Theme: Auto</button>
</header>

<div class="app">
  <aside class="side" id="side"></aside>
  <main>
    <section id="tab-data">
      <div class="toolbar">
        <button id="bImport">Import CSV / Excel…</button>
        <button id="bPaste">Paste data…</button>
        <button id="bSample">Sample data…</button>
        <span class="sep"></span>
        <button id="bUndo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
        <button id="bAddRow">+ Row</button>
        <button id="bAddCol">+ Column</button>
        <button id="bCompute">Compute…</button>
        <button id="bRecode">Recode…</button>
        <button id="bTransform">Transform…</button>
        <button id="bSort">Sort…</button>
        <button id="bFilter">Filter…</button>
        <span class="sep"></span>
        <button id="bExport">Export CSV</button>
        <button id="bClear" class="danger">Clear</button>
        <span class="info" id="dataInfo"></span>
        <input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
      </div>
      <div class="filterbar" id="filterBar" hidden>Filter active: <code id="filterExpr"></code><span id="filterN"></span><span class="spacer"></span><button id="bFilterOff">Remove filter</button></div>
      <div class="tablewrap" id="tableWrap"></div>
    </section>
    <section id="tab-results" hidden>
      <div class="toolbar">
        <button id="bWord" class="primary" title="Word document with numbered tables, figures and captions">Export Word (.docx)</button>
        <button id="bSaveRes">Export results (HTML)</button>
        <button id="bPrint">Print / PDF</button>
        <button id="bClearRes" class="danger">Clear results</button>
        <span class="info">Tip: click any title or paragraph to edit it before exporting; use ↑ ↓ to reorder.</span>
      </div>
      <div id="results"></div>
    </section>
  </main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm">
  <div class="dh" id="dlgTitle"></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><span class="err" id="dlgErr" style="margin-right:auto"></span><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="ok" id="dlgOk">Run</button></div>
</form></dialog>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} }
};

/* ================= Distributions & special functions ================= */
const LG = [0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function lgamma(x){
  if (x < 0.5) return Math.log(Math.PI/Math.abs(Math.sin(Math.PI*x))) - lgamma(1-x);
  x -= 1; let a = LG[0]; const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LG[i]/(x+i);
  return 0.5*Math.log(2*Math.PI) + (x+0.5)*Math.log(t) - t + Math.log(a);
}
const lchoose = (n,k) => lgamma(n+1) - lgamma(k+1) - lgamma(n-k+1);
function betacf(a,b,x){
  const FP = 1e-300; let qab=a+b, qap=a+1, qam=a-1, c=1, d=1-qab*x/qap;
  if (Math.abs(d)<FP) d=FP; d=1/d; let h=d;
  for (let m=1; m<=400; m++){
    const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2));
    d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d; h*=d*c;
    aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d=1+aa*d; if(Math.abs(d)<FP)d=FP; c=1+aa/c; if(Math.abs(c)<FP)c=FP; d=1/d;
    const del=d*c; h*=del; if (Math.abs(del-1)<3e-15) break;
  }
  return h;
}
function ibeta(x,a,b){ // regularized incomplete beta I_x(a,b)
  if (!(x>0)) return 0; if (x>=1) return 1;
  const bt = Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));
  return x < (a+1)/(a+b+2) ? bt*betacf(a,b,x)/a : 1 - bt*betacf(b,a,1-x)/b;
}
function gammaQ(a,x){ // upper regularized incomplete gamma
  if (!(x>0)) return 1; if (x===Infinity) return 0;
  const lf = -x + a*Math.log(x) - lgamma(a);
  if (x < a+1){
    let ap=a, sum=1/a, del=sum;
    for (let n=0; n<1000; n++){ ap++; del*=x/ap; sum+=del; if (Math.abs(del)<Math.abs(sum)*1e-16) break; }
    return 1 - sum*Math.exp(lf);
  }
  let b=x+1-a, c=1e300, d=1/b, h=d;
  for (let i=1; i<1000; i++){
    const an=-i*(i-a); b+=2; d=an*d+b; if(Math.abs(d)<1e-300)d=1e-300;
    c=b+an/c; if(Math.abs(c)<1e-300)c=1e-300; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<1e-16) break;
  }
  return Math.exp(lf)*h;
}
const Phi = z => z===Infinity?1:z===-Infinity?0: z<0 ? 0.5*gammaQ(0.5,z*z/2) : 1-0.5*gammaQ(0.5,z*z/2);
const normPdf = z => Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);
function normInv(p){ // Acklam with one Newton refinement
  if (p<=0) return -Infinity; if (p>=1) return Infinity;
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  let q,r,x;
  if (p<0.02425){ q=Math.sqrt(-2*Math.log(p)); x=(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  else if (p>1-0.02425){ q=Math.sqrt(-2*Math.log(1-p)); x=-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  else { q=p-0.5; r=q*q; x=(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  const e = Phi(x)-p; return x - e*Math.sqrt(2*Math.PI)*Math.exp(x*x/2)/(1+x*e*Math.sqrt(2*Math.PI)*Math.exp(x*x/2)/2);
}
function tcdf(t,df){
  if (t===Infinity) return 1; if (t===-Infinity) return 0;
  const tail = 0.5*ibeta(df/(df+t*t), df/2, 0.5);
  return t>0 ? 1-tail : tail;
}
function tinv(p,df){
  let lo=-1e4, hi=1e4;
  for (let i=0;i<200;i++){ const m=(lo+hi)/2; if (tcdf(m,df)<p) lo=m; else hi=m; }
  return (lo+hi)/2;
}
const fUpper = (F,d1,d2) => F===Infinity?0: F<=0?1: ibeta(d2/(d2+d1*F), d2/2, d1/2);
const chiUpper = (x,k) => x<=0?1: gammaQ(k/2, x/2);
function pFrom(cdf, alt){ // cdf = P(T <= observed)
  if (alt==='greater') return 1-cdf;
  if (alt==='less') return cdf;
  return Math.min(1, 2*Math.min(cdf, 1-cdf));
}
const pT = (t,df,alt) => pFrom(tcdf(t,df), alt);
const pZ = (z,alt) => pFrom(Phi(z), alt);
function ciT(est,se,df,conf,alt){
  if (alt==='greater') return [est - tinv(conf,df)*se, Infinity];
  if (alt==='less') return [-Infinity, est + tinv(conf,df)*se];
  const q = tinv(1-(1-conf)/2, df); return [est-q*se, est+q*se];
}
function holm(ps){
  const m=ps.length, idx=ps.map((p,i)=>i).sort((a,b)=>ps[a]-ps[b]), out=new Array(m); let run=0;
  idx.forEach((i,r)=>{ run=Math.max(run, Math.min(1,(m-r)*ps[i])); out[i]=run; });

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/,1)[0]; let delim=',', best=-1;
  for (const c of ['\t',',',';','|']){ const n=first.split(c).length; if (n>best){best=n;delim=c;} }
  const rows=[]; let row=[], field='', q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){field+='"';i++;} else q=false; } else field+=ch; }
    else if (ch==='"' && field==='') q=true;
    else if (ch===delim){ row.push(field); field=''; }
    else if (ch==='\n'||ch==='\r'){ if (ch==='\r'&&text[i+1]==='\n') i++; row.push(field); rows.push(row); row=[]; field=''; }
    else field+=ch;
  }
  if (field!==''||row.length){ row.push(field); rows.push(row); }

}
function loadTable(rows, header=true){

  if (D.cols.length) snap();
  D={cols:[], rows:[]};
  for (let j=0;j<w;j++) D.cols.push(uniqueName((head[j]||'').trim()||`V${j+1}`));
  D.rows=rows.map(r=>Array.from({length:w},(_,j)=>(r[j]??'').trim()));
  dataChanged(true);
}
function toCSV(){
  const q=v=>{ v=String(v??''); return /[",\n\r]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; };
  return [D.cols, ...D.rows].map(r=>r.map(q).join(',')).join('\n');

function sampleData(){
  let s=20240917; const rnd=()=>{ s=(s*1664525+1013904223)%4294967296; return s/4294967296; };
  const nrm=()=>Math.sqrt(-2*Math.log(rnd()+1e-12))*Math.cos(2*Math.PI*rnd());
  const rows=[['id','group','sex','age','height_cm','weight_kg','score_pre','score_post','satisfied']];
  for (let i=1;i<=90;i++){
    const g='ABC'[(i-1)%3], sex=rnd()<0.5?'F':'M', age=Math.round(22+rnd()*40);
    const h=(sex==='M'?176:163)+nrm()*7, w=h*0.42-2+nrm()*8+(age-40)*0.12;
    const pre=60+nrm()*10, post=pre+({A:2,B:6,C:9})[g]+nrm()*6;
    const sat=rnd()< ({A:.4,B:.55,C:.75})[g] ? 'Yes':'No';
    rows.push([i,g,sex,age,h.toFixed(1),w.toFixed(1),pre.toFixed(1),i===17?'':post.toFixed(1),sat]);
  }
  return rows.map(r=>r.map(String));
}

/* ================= Formatting & output helpers ================= */
function f(x,d=3){
  if (x==null || Number.isNaN(x)) return '—';
  if (x===Infinity) return '∞'; if (x===-Infinity) return '−∞';
  if (Number.isInteger(x) && d===0) return String(x);
  const ax=Math.abs(x);
  if (ax>=1e7 || (ax<1e-4 && ax!==0)) return x.toExponential(2);
  return x.toFixed(d);
}
const fp = p => p==null||Number.isNaN(p) ? '—' : p<0.001 ? '< .001' : p.toFixed(3).replace(/^0/,'');
const pAPA = p => p<0.001 ? '< .001' : '= '+p.toFixed(3).replace(/^0/,'');
const P = p => ({p, toString(){ return fp(p); }});
const ci = (c) => `[${f(c[0])}, ${f(c[1])}]`;
function table(head, rows, cls='res'){
  const cell = v => (v && typeof v==='object' && 'p' in v) ? `<td class="${v.p<0.05?'sig':''}">${v}</td>` : `<td>${v??''}</td>`;
  return `<table class="${cls}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(cell).join('')}</tr>`).join('')}</tbody></table>`;
}

const report = t => `<div class="report"><b>Report:</b> ${t}</div>`;

/* ================= SVG charts ================= */
const PAL=['#3b82f6','#f97316','#10b981','#a855f7','#ec4899','#06b6d4','#eab308','#64748b'];
function niceTicks(min,max,count=5){
  if (!(max>min)){ min-=1; max+=1; }
  const step0=(max-min)/count, mag=10**Math.floor(Math.log10(step0)), e=step0/mag;
  const step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;
  const lo=Math.floor(min/step+1e-9)*step, hi=Math.ceil(max/step-1e-9)*step, ticks=[];
  for (let v=lo; v<=hi+step*1e-6; v+=step) ticks.push(+v.toPrecision(12));
  return {lo,hi,ticks};
}
const tickFmt = t => Math.abs(t)>=1e5 ? t.toExponential(1) : String(+t.toPrecision(6));
function makePlot({xmin,xmax,ymin,ymax,xlab='',ylab='',title='',cats=null,legend=null,w=600,h=360}){
  const rot = cats && cats.length>6;
  const m={l:58,r:18,t:(title?30:14)+(legend?20:0),b:rot?78:46};
  const X = cats ? null : niceTicks(xmin,xmax), Y=niceTicks(ymin,ymax);
  const pw=w-m.l-m.r, ph=h-m.t-m.b;
  const sx = cats ? i=>m.l+(i+0.5)*pw/cats.length : v=>m.l+(v-X.lo)/(X.hi-X.lo)*pw;
  const sy = v=>m.t+ph-(v-Y.lo)/(Y.hi-Y.lo)*ph;
  let g='';
  if (title) g+=`<text class="ttl" x="${m.l}" y="18">${esc(title)}</text>`;
  if (legend){ let lx=m.l; const ly=title?38:16; legend.forEach((name,i)=>{ const lab=String(name).length>16?String(name).slice(0,15)+'…':String(name); if (lx>w-60) return; g+=`<rect x="${lx}" y="${ly-8}" width="10" height="10" rx="2" fill="${PAL[i%PAL.length]}"/><text x="${lx+14}" y="${ly+1}">${esc(lab)}</text>`; lx+=24+lab.length*6.3; }); }
  for (const t of Y.ticks) g+=`<line class="grid" x1="${m.l}" x2="${w-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${m.l-7}" y="${sy(t)+4}" text-anchor="end">${tickFmt(t)}</text>`;
  if (cats) cats.forEach((c,i)=>{ const lab=esc(String(c).length>14?String(c).slice(0,13)+'…':c);

hist:{ g:'Graphs', name:'Histogram',

t1:{ g:'Compare means', name:'One-sample t-test',
  fields:[{k:'x',t:'num',label:'Variable'},{k:'mu',t:'number',label:'Test value (μ₀)',def:0},ALT,CONF],
  run(o){

t2:{ g:'Compare means', name:'Independent-samples t-test',

  }},
tp:{ g:'Compare means', name:'Paired-samples t-test',

anova:{ g:'Compare means', name:'One-way ANOVA',
  fields:[{k:'y',t:'num',label:'Dependent variable'},{k:'g',t:'col',label:'Factor (grouping variable)',prefCat:true},{k:'post',t:'select',label:'Post hoc comparisons',options:[['tukey','Tukey HSD (equal variances)'],['gh','Games–Howell (unequal variances)'],['holm','Welch t-tests, Holm-adjusted'],['none','None']]}],
  run(o){

      + table(['Statistic','Value'],[['η² (eta squared)',f(A.eta2)],['ω² (omega squared)',f(A.omega2)],[`Welch's ANOVA F(${wa.df1}, ${f(wa.df2,2)})`,f(wa.F)],["Welch's p",P(wa.p)],[`Levene's test F(${lv.dfb}, ${lv.dfw})`,f(lv.F)],['Levene p',P(lv.p)]]);

mwu:{ g:'Nonparametric', name:'Mann–Whitney U test',
  fields:[{k:'y',t:'num',label:'Dependent variable'},{k:'g',t:'col',label:'Grouping variable (2 levels)',prefCat:true},ALT],
  run(o){
    const sp=twoGroups(o), [[l1,a],[l2,b]]=sp, n1=a.length, n2=b.length, N=n1+n2;
    const {r,T}=rank([...a,...b]), R1=sum(r.slice(0,n1)), R2=sum(r.slice(n1));

      + table(['U','W','z','p (asymptotic)','p (exact)','r (effect size)','Rank-biserial'],[[f(U1,1),f(R1,1),f(z),P(pa),exact?P(pe):'—',f(rEff),f(2*U1/(n1*n2)-1)]])

      + report(`U = ${f(U1,1)}, ${exact?'exact ':''}p ${pAPA(p)}, r = ${f(rEff,2)}`);
  }},
wsr:{ g:'Nonparametric', name:'Wilcoxon signed-rank test',
  fields:[{k:'x',t:'num',label:'Variable 1'},{k:'y',t:'num',label:'Variable 2',nth:1},ALT],
  run(o){

    const {r,T}=rank(d.map(Math.abs)); let Wp=0; d.forEach((v,i)=>{ if (v>0) Wp+=r[i]; });
    const Wm=n*(n+1)/2-Wp, mu=n*(n+1)/4, sg=Math.sqrt(n*(n+1)*(2*n+1)/24-T/48);
    const cc = o.alt==='two' ? Math.sign(Wp-mu)*0.5 : o.alt==='greater' ? 0.5 : -0.5;
    const z=(Wp-mu-cc)/sg, pa=pZ(z,o.alt), exact=T===0&&n<=50, pe=exact?exactP(signedRankExactDist(n),Wp,o.alt):null, rEff=(Wp-mu)/sg/Math.sqrt(n);

      + table(['W+','W−','z','p (asymptotic)','p (exact)','r (effect size)'],[[f(Wp,1),f(Wm,1),f(z),P(pa),exact?P(pe):'—',f(rEff)]])
      + note(`Differences = ${cname(o.x)} − ${cname(o.y)}; ${x.length-n} zero differences dropped, n = ${n}. Exact p computed when there are no ties and n ≤ 50.`)
      + report(`W = ${f(Wp,1)}, ${exact?'exact ':''}p ${pAPA(exact?pe:pa)}, r = ${f(rEff,2)}`);

kw:{ g:'Nonparametric', name:'Kruskal–Wallis test',
  fields:[{k:'y',t:'num',label:'Dependent variable'},{k:'g',t:'col',label:'Grouping variable',prefCat:true},{k:'post',t:'check',label:"Dunn's post hoc test (Holm-adjusted)",def:true}],
  run(o){

    const all=sp.flatMap(g=>g[1]), N=all.length, {r,T}=rank(all); let off=0;
    const R=sp.map(([,a])=>{ const s=sum(r.slice(off,off+a.length)); off+=a.length; return s; });
    let H=12/(N*(N+1))*sum(R.map((s,i)=>s*s/sp[i][1].length))-3*(N+1); H/=1-T/(N**3-N);

      + table(['H','df','p','ε² (epsilon squared)'],[[f(H),df,P(p),f(H/(N-1))]]);
    if (o.post && sp.length>2){

        const ni=sp[i][1].length, nj=sp[j][1].length, z=(R[i]/ni-R[j]/nj)/Math.sqrt(base*(1/ni+1/nj)), pp=pZ(z,'two');

corr:{ g:'Relationships', name:'Correlation matrix',
  fields:[{k:'vars',t:'nums',label:'Variables (2 or more)'},{k:'method',t:'select',label:'Method',options:[['pearson','Pearson r'],['spearman','Spearman ρ'],['kendall','Kendall τ-b']]}],
  run(o){
    need(o.vars.length>=2,'Select at least 2 variables.');
    const V=o.vars, k=V.length, cells=[];
    for (let i=0;i<k;i++){ const row=[`<b>${cname(V[i])}</b>`];
      for (let j=0;j<k;j++){
        if (j>=i){ row.push(j===i?'<span class="note">—</span>':''); continue; }
        let [x,y]=pairs(V[i],V[j]); const n=x.length;
        if (n<3){ row.push('<small>n &lt; 3</small>'); continue; }
        let rr, p;
        if (o.method==='kendall') ({r:rr,p}=kendall(x,y));
        else { if (o.method==='spearman'){ x=rank(x).r; y=rank(y).r; } rr=pearson(x,y); const t=rr*Math.sqrt((n-2)/(1-rr*rr)); p=Math.abs(rr)>=1?0:pT(t,n-2,'two'); }
        const bg = Number.isFinite(rr) ? (rr>0?`rgba(59,130,246,${(Math.abs(rr)*0.5).toFixed(2)})`:`rgba(239,68,68,${(Math.abs(rr)*0.5).toFixed(2)})`) : 'transparent';
        const star = p<0.001?'***':p<0.01?'**':p<0.05?'*':'';
        row.push(`<div style="background:${bg};padding:4px 6px;border-radius:4px"><b>${f(rr)}${star}</b><small>p ${fp(p)}</small><small>n = ${n}</small></div>`);
      }
      cells.push(row);
    }
    return table(['',...V.map(cname)],cells,'res corr')+note(`${({pearson:'Pearson',spearman:'Spearman rank',kendall:'Kendall τ-b (asymptotic p)'})[o.method]} correlations, pairwise deletion. * p < .05, ** p < .01, *** p < .001 (two-sided).`);
  }},
reg:{ g:'Relationships', name:'Linear regression',
  fields:[{k:'y',t:'num',label:'Dependent variable'},{k:'xs',t:'cols',label:'Predictors (text columns are dummy-coded)'},{k:'plots',t:'check',label:'Residual diagnostics plots',def:true},{k:'save',t:'check',label:'Save predicted values & residuals as new columns'}],
  run(o){
    const xs=o.xs.filter(j=>j!==o.y); need(xs.length,'Select at least one predictor (other than the dependent variable).');
    const rows=AR(), Y=numCol(o.y), {idx,terms,cols,X}=buildDesign(rows,xs,i=>Number.isFinite(Y[i]));
    const n=idx.length, p=terms.length; need(n>p,`Not enough complete cases (${n}) for ${p} parameters.`);
    const y=idx.map(i=>Y[i]), M=ols(X,y);
    need(M,'The predictors are perfectly collinear (singular design matrix). Remove redundant predictors.');
    const dfe=n-p, dfr=p-1, mse=M.sse/dfe, ssr=M.sst-M.sse, F=(ssr/dfr)/mse, pF=fUpper(F,dfr,dfe), adj=1-(1-M.r2)*(n-1)/dfe, tq=tinv(0.975,dfe), sy=sd(y);
    const vif = cols.map((c,k)=>{ if (cols.length<2) return NaN; const others=cols.filter((_,q)=>q!==k); const m=ols(c.map((_,r)=>[1,...others.map(q=>q[r])]),c); return m?1/(1-m.r2):Infinity; });
    const coef=M.b.map((b,k)=>{ const se=Math.sqrt(M.inv[k][k]*mse), t=b/se, pp=pT(t,dfe,'two');
      return [terms[k],f(b),f(se),k?f(b*sd(cols[k-1])/sy):'',f(t),P(pp),ci([b-tq*se,b+tq*se]),k?f(vif[k-1],2):'']; });
    let dw=0; for (let i=1;i<n;i++) dw+=(M.res[i]-M.res[i-1])**2; dw/=M.sse;
    const eq='ŷ = '+M.b.map((b,k)=>k?`${b<0?'−':'+'} ${f(Math.abs(b))}·${terms[k]}`:f(b)).join(' ');
    let out=h5('Model summary')+table(['N','R','R²','Adjusted R²','Std. error of estimate','Durbin–Watson'],[[n,f(Math.sqrt(M.r2)),f(M.r2),f(adj),f(Math.sqrt(mse)),f(dw)]])
      + h5('ANOVA')+table(['Source','Sum of squares','df','Mean square','F','p'],[['Regression',f(ssr),dfr,f(ssr/dfr),f(F),P(pF)],['Residual',f(M.sse),dfe,f(mse),'',''],['Total',f(M.sst),n-1,'','','']])
      + h5('Coefficients')+table(['Term','B','SE','β (std.)','t','p','95% CI','VIF'],coef)
      + note(`${esc(D.cols[o.y])}: ${eq}`) + note(`${rows.length-n} rows excluded for missing values (listwise).`);
    if (o.save){ const nm=saveCols(rows,idx,[[`${D.cols[o.y]}_pred`,M.fit],[`${D.cols[o.y]}_resid`,M.res]]); out+=note(`Saved new columns: ${nm.map(esc).join(', ')}.`); }
    if (vif.some(v=>v>10)) out+=warn('Some VIF values exceed 10 — strong multicollinearity.');
    if (o.plots) out+=`<div class="plots">${scatterSVG(M.fit,M.res,{xlab:'Fitted values',ylab:'Residuals',ref0:true,title:'Residuals vs fitted'})}${qqSVG(M.res,{title:'Normal Q-Q of residuals'})}</div>`;

  }},
chisq:{ g:'Categorical', name:'Chi-square test (crosstab)',
  fields:[{k:'r',t:'col',label:'Row variable',prefCat:true},{k:'c',t:'col',label:'Column variable',prefCat:true,nth:1},{k:'pct',t:'select',label:'Percentages',options:[['none','None'],['row','Row %'],['col','Column %'],['total','Total %']]}],
  run(o){
    need(o.r!==o.c,'Choose two different variables.');
    const a=strCol(o.r), b=strCol(o.c), ok=a.map((v,i)=>v!=null&&b[i]!=null);
    const R=sortLevels([...new Set(a.filter((v,i)=>ok[i]))]), C=sortLevels([...new Set(b.filter((v,i)=>ok[i]))]);
    need(R.length>=2&&C.length>=2,'Each variable needs at least 2 categories.');
    need(R.length*C.length<=400,'Too many categories for a crosstab (max 400 cells).');
    const O=R.map(()=>C.map(()=>0)); a.forEach((v,i)=>{ if (ok[i]) O[R.indexOf(v)][C.indexOf(b[i])]++; });
    const rt=O.map(sum), ct=C.map((_,j)=>sum(O.map(r=>r[j]))), N=sum(rt);
    const E=O.map((r,i)=>r.map((_,j)=>rt[i]*ct[j]/N));
    let x2=0,g2=0,low=0; O.forEach((r,i)=>r.forEach((v,j)=>{ const e=E[i][j]; x2+=(v-e)**2/e; if (v>0) g2+=2*v*Math.log(v/e); if (e<5) low++; }));
    const df=(R.length-1)*(C.length-1), V=Math.sqrt(x2/(N*(Math.min(R.length,C.length)-1)));
    const pc=(v,i,j)=>o.pct==='row'?v/rt[i]:o.pct==='col'?v/ct[j]:v/N;
    const rows=O.map((r,i)=>[`<b>${esc(R[i])}</b>`,...r.map((v,j)=>`${v}<div class="sub">exp ${f(E[i][j],1)}${o.pct!=='none'?` · ${f(100*pc(v,i,j),1)}%`:''}</div>`),`<b>${rt[i]}</b>`]);
    rows.push(['<b>Total</b>',...ct.map(v=>`<b>${v}</b>`),`<b>${N}</b>`]);
    const tests=[['Pearson χ²',f(x2),df,P(chiUpper(x2,df))],['Likelihood ratio G²',f(g2),df,P(chiUpper(g2,df))]];
    if (R.length===2&&C.length===2){

anova2:{ g:'Compare means', name:'Two-way ANOVA',
  fields:[{k:'y',t:'num',label:'Dependent variable'},{k:'a',t:'col',label:'Factor A',prefCat:true},{k:'b',t:'col',label:'Factor B',prefCat:true,nth:1},{k:'inter',t:'check',label:'Include A × B interaction',def:true}],

        ['<b>Marginal</b>',...lb.map(b=>f(mean(idx.filter(i=>B[i]===b).map(i=>Y[i])))),f(mean(y))]]);

rmanova:{ g:'Compare means', name:'Repeated-measures ANOVA',
  fields:[{k:'vars',t:'nums',label:'Conditions (one column per measurement, ≥ 2)'},{k:'post',t:'check',label:'Pairwise paired t-tests (Holm-adjusted)',def:true}],
  run(o){
    need(o.vars.length>=2,'Select at least 2 columns.');
    const C=o.vars.map(numCol), k=C.length, M=C[0].map((_,i)=>C.map(c=>c[i])).filter(r=>r.every(Number.isFinite)), n=M.length;

      + note(`${AR().length-n} rows with missing values excluded (listwise).`)

friedman:{ g:'Nonparametric', name:'Friedman test',
  fields:[{k:'vars',t:'nums',label:'Conditions (one column per measurement, ≥ 2)'}],
  run(o){
    need(o.vars.length>=2,'Select at least 2 columns.');

logreg:{ g:'Relationships', name:'Logistic regression',
  fields:[{k:'y',t:'col',label:'Outcome variable',prefCat:true,nth:1},{k:'ev',t:'level',of:'y',label:'Event value (coded 1; all other values = 0)'},{k:'xs',t:'cols',label:'Predictors (text columns are dummy-coded)'},{k:'save',t:'check',label:'Save predicted probabilities as a new column'}],
  run(o){

    const rows=AR(), Ys=strCol(o.y), {idx,terms,X}=buildDesign(rows,xs,i=>Ys[i]!=null);

    need(n>p,`Not enough complete cases (${n}) for ${p} parameters.`);
    need(n1>0&&n1<n,'The outcome must contain both event and non-event cases.');

    const cs=1-Math.exp(2*(ll0-M.ll)/n), nag=cs/(1-Math.exp(2*ll0/n)), z=1.959963984540054;
    const ses=M.b.map((_,k)=>Math.sqrt(M.inv[k][k]));

    ord.forEach((i,r)=>{ y[i]?cT++:cF++; if (r===ord.length-1 || M.pr[ord[r+1]]!==M.pr[i]){ fx.push(cF/(n-n1)); ty.push(cT/n1); } });

        [[n,n1,f(-2*M.ll),f(lr),dfm,P(plr),f(1-M.ll/ll0),f(cs),f(nag),f(-2*M.ll+2*p),f(auc)]])
      + h5('Coefficients')+table(['Term','B','SE','Wald z','p','Odds ratio','95% CI (OR)'],coef)
      + h5('Classification (cutoff 0.5)')+table(['Observed \\ Predicted','0','1','% correct'],[
        [`0 (not ${esc(o.ev)})`,tn,fpos,f(100*tn/(n-n1),1)],[`1 (${esc(o.ev)})`,fneg,tp,f(100*tp/n1,1)],['<b>Overall</b>','','',`<b>${f(100*(tp+tn)/n,1)}</b>`]])

prop:{ g:'Categorical', name:'One-sample proportion test',
  fields:[{k:'x',t:'col',label:'Variable',prefCat:true},{k:'ev',t:'level',of:'x',label:'Success value'},{k:'p0',t:'number',label:'Hypothesized proportion (p₀)',def:0.5},ALT,CONF],

pca:{ g:'Multivariate', name:'Principal component analysis',
  fields:[{k:'vars',t:'nums',label:'Variables (≥ 3 recommended)'},{k:'ncomp',t:'number',label:'Components to extract',ph:'auto (eigenvalue > 1)'},{k:'rot',t:'select',label:'Rotation',options:[['varimax','Varimax'],['none','None (unrotated)']]},{k:'save',t:'check',label:'Save component scores as new columns'}],
  run(o){
    need(o.vars.length>=2,'Select at least 2 variables.');
    const rows=AR(), C=o.vars.map(numCol), p=C.length, idx=C[0].map((_,i)=>i).filter(i=>C.every(c=>Number.isFinite(c[i]))), n=idx.length;
    need(n>p,`Need more complete cases (${n}) than variables (${p}).`);
    const mu=C.map(c=>mean(idx.map(i=>c[i]))), sg=C.map((c,j)=>sd(idx.map(i=>c[i])));
    need(sg.every(s=>s>0),'A selected variable has zero variance.');

      + h5('Eigenvalues')+table(['Component','Eigenvalue','% of variance','Cumulative %'],values.map((v,c)=>{ cum+=v; return [`${c<m?'<b>':''}PC${c+1}${c<m?'</b>':''}`,f(v),f(100*v/p,2),f(100*cum/p,2)]; }))
      + h5(`Loadings (${m} component${m>1?'s':''}${rotated?', varimax rotation':''})`)
      + `<table class="res"><thead><tr><th>Variable</th>${[...Array(m)].map((_,c)=>`<th>${comp(c)}</th>`).join('')}<th>Communality</th></tr></thead><tbody>`
      + o.vars.map((j,i)=>`<tr><td>${cname(j)}</td>${L[i].map(v=>`<td class="${Math.abs(v)>=0.4?'hi':''}">${f(v)}</td>`).join('')}<td>${f(sum(L[i].map(v=>v*v)))}</td></tr>`).join('')
      + `<tr><td><i>SS loadings</i></td>${ssl.map(v=>`<td>${f(v)}</td>`).join('')}<td></td></tr><tr><td><i>% of variance</i></td>${ssl.map(v=>`<td>${f(100*v/p,2)}</td>`).join('')}<td></td></tr></tbody></table>`
      + note('Analysis of the correlation matrix (standardized variables). Loadings with |value| ≥ 0.40 are bold. KMO ≥ .6 and a significant Bartlett test suggest the data are suitable.');
    if (o.save){ need(Ri,'Cannot compute scores: the correlation matrix is singular.');

      const sc=[...Array(m)].map((_,c)=>Z.map(z=>sum(z.map((v,a)=>v*W[a][c]))));

    return out+`<div class="plots">${lineSVG(values.map((_,i)=>i+1),[values],{xlab:'Component',ylab:'Eigenvalue',title:'Scree plot',hline:1,ymin:0})}</div>`;
  }},
power:{ g:'Planning', name:'Power & sample size', noData:true,
  fields:[{k:'test',t:'select',label:'Study design / test',options:[['t2','Two independent means (t-test)'],['t1','Paired / one-sample mean (t-test)'],['p2','Two independent proportions (chi-square)'],['anova','Several group means (one-way ANOVA)'],['r','Correlation (Pearson r)']]},
    {k:'solve',t:'select',label:'Calculate',options:[['n','Required sample size'],['power','Power for a given sample size']]},
    {k:'es',t:'number',label:"Effect size — Cohen's d (t-tests), f (ANOVA) or r (correlation)",def:0.5},
    {k:'p1',t:'number',label:'Two proportions: expected proportion in group 1',def:0.6},{k:'p2',t:'number',label:'Two proportions: expected proportion in group 2',def:0.4},
    {k:'k',t:'number',label:'ANOVA: number of groups',def:3},
    {k:'alpha',t:'number',label:'Significance level (α)',def:0.05},
    {k:'tails',t:'select',label:'Tails (t-tests, proportions, correlation)',options:[['2','Two-sided'],['1','One-sided']]},
    {k:'pw',t:'number',label:'Target power (when calculating sample size)',def:0.8},
    {k:'n',t:'number',label:'Sample size per group (total N for paired / correlation) — when calculating power',def:30},
    {k:'drop',t:'number',label:'Expected dropout rate (%)',def:10}],
  run(o){
    const T=o.test, es=Math.abs(o.es??0), a=o.alpha, tails=T==='anova'?2:+o.tails, K=Math.round(o.k||3), drop=Math.max(0,Math.min(90,o.drop||0));
    need(a>0&&a<0.5,'α must be between 0 and 0.5.');
    if (T==='p2') need(o.p1>0&&o.p1<1&&o.p2>0&&o.p2<1&&o.p1!==o.p2,'Enter two different proportions between 0 and 1.');
    else need(es>0,'Effect size must be non-zero.');
    if (T==='r') need(es<1,'r must be between −1 and 1.'); if (T==='anova') need(K>=2,'Need at least 2 groups.');
    const perGroup=T==='t2'||T==='p2'||T==='anova', minN=T==='r'?4:2;
    const pow=n=>{
      if (T==='r'){ if (n<4) return 0; const z=Math.atanh(es)*Math.sqrt(n-3), zc=normInv(1-a/tails); return tails===2?Phi(z-zc)+Phi(-z-zc):Phi(z-zc); }
      if (T==='p2'){ const p1=o.p1, p2=o.p2, pb=(p1+p2)/2, d=Math.abs(p1-p2), za=normInv(1-a/tails); return Phi((d*Math.sqrt(n)-za*Math.sqrt(2*pb*(1-pb)))/Math.sqrt(p1*(1-p1)+p2*(1-p2))); }
      if (T==='anova'){ const d2=K*n-K; if (d2<1) return 0; return 1-ncfCdf(fInv(1-a,K-1,d2),K-1,d2,es*es*K*n); }

      if (tails===2){ const tc=tinv(1-a/2,df); return 1-nctcdf(tc,df,dl)+nctcdf(-tc,df,dl); }
      return 1-nctcdf(tinv(1-a,df),df,dl);
    };
    let n;
    if (o.solve==='n'){
      need(o.pw>a&&o.pw<1,'Target power must be between α and 1.');
      let lo=minN, hi=lo; while (pow(hi)<o.pw){ lo=hi; hi*=2; need(hi<5e6,'Required sample size is too large.'); }
      while (hi-lo>1){ const mid=Math.floor((lo+hi)/2); if (pow(mid)>=o.pw) hi=mid; else lo=mid; }
      n=pow(lo)>=o.pw?lo:hi;
    } else { n=Math.round(o.n??0); need(n>=minN,'Sample size is too small.'); }
    const groups=T==='t2'||T==='p2'?2:T==='anova'?K:1, tot=n*groups, pw=pow(n), nd=Math.ceil(n/(1-drop/100)), lab=perGroup?'n per group':'N';
    const esTxt=T==='p2'?`proportions of ${o.p1} vs ${o.p2}`:T==='anova'?`f = ${f(es,2)}`:T==='r'?`r = ${f(es,2)}`:`d = ${f(es,2)}`;
    const name={t2:'Independent t-test',t1:'Paired / one-sample t-test',p2:'Two proportions',anova:`One-way ANOVA (${K} groups)`,r:'Correlation'}[T];
    const ns=[]; const top=Math.max(n*2,10); for (let i=0;i<=40;i++){ const v=Math.max(minN,Math.round(top*i/40)); if (!ns.includes(v)) ns.push(v); }
    const testWord={t2:'an independent-samples t-test',t1:'a paired t-test',p2:'a chi-square test',anova:'a one-way ANOVA',r:'a test of Pearson correlation'}[T];
    const para=o.solve==='n'
      ? `Sample size was calculated using StatBench. A sample size of ${perGroup?`${n} participants per group (${tot} in total)`:`${n} participants`} achieves ${Math.round(o.pw*100)}% power to detect ${T==='p2'?`a difference between ${esTxt}`:`an effect size of ${esTxt}`} using ${testWord} at a ${tails===2||T==='anova'?'two':'one'}-sided significance level of ${a}.${drop>0?` To allow for an expected dropout rate of ${drop}%, ${perGroup?`${nd} participants per group (${nd*groups} in total)`:`${nd} participants`} will be recruited.`:''}`
      : `With ${perGroup?`${n} participants per group (${tot} in total)`:`${n} participants`}, the study has ${f(100*pw,1)}% power to detect ${T==='p2'?`a difference between ${esTxt}`:`an effect size of ${esTxt}`} using ${testWord} at α = ${a}.`;

      + `<p class="para">${esc(para)}</p>`
      + note({r:'Fisher z approximation. Conventions: r = 0.1 small, 0.3 medium, 0.5 large.',p2:'Normal approximation without continuity correction (Fleiss).',anova:"Exact power from the noncentral F distribution. Cohen's f: 0.10 small, 0.25 medium, 0.40 large.",t1:'Exact power from the noncentral t distribution. d = 0.2 small, 0.5 medium, 0.8 large.',t2:'Exact power from the noncentral t distribution. d = 0.2 small, 0.5 medium, 0.8 large.'}[T])
      + `<div class="plots">${lineSVG(ns,[ns.map(pow)],{xlab:lab,ylab:'Power',title:'Power curve',hline:o.solve==='n'?o.pw:null,ymin:0,ymax:1,points:false})}</div>`;
  }},
outliers:{ g:'Describe', name:'Outlier detection',
  fields:[{k:'x',t:'num',label:'Variable'},{k:'alpha',t:'number',label:"Grubbs' test significance level",def:0.05}],
  run(o){
    const rows=AR(), all=numCol(o.x), idx=all.map((_,i)=>i).filter(i=>Number.isFinite(all[i])), a=idx.map(i=>all[i]), n=a.length;
    need(n>=3,'Need at least 3 values.');
    const s=summary(a), fl=new Map(), add=(i,m)=>{ if (!fl.has(i)) fl.set(i,[]); fl.get(i).push(m); };
    const f15=[s.q1-1.5*s.iqr,s.q3+1.5*s.iqr], f3=[s.q1-3*s.iqr,s.q3+3*s.iqr];
    idx.forEach((i,r)=>{ const v=a[r], z=(v-s.mean)/s.sd;
      if (v<f3[0]||v>f3[1]) add(i,'IQR × 3 (extreme)'); else if (v<f15[0]||v>f15[1]) add(i,'IQR × 1.5');
      if (Math.abs(z)>3) add(i,'|z| > 3'); });
    const al=o.alpha||0.05, gr=[]; let rest=idx.slice();
    while (rest.length>=3){
      const v=rest.map(i=>all[i]), m=mean(v), sv=sd(v), N=v.length; if (!(sv>0)) break;
      let bi=0; v.forEach((x,i)=>{ if (Math.abs(x-m)>Math.abs(v[bi]-m)) bi=i; });
      const G=Math.abs(v[bi]-m)/sv, tc=tinv(1-al/(2*N),N-2), Gc=(N-1)/Math.sqrt(N)*Math.sqrt(tc*tc/(N-2+tc*tc));
      const t2=N*(N-2)*G*G/((N-1)**2-N*G*G), p=t2>0?Math.min(1,2*N*(1-tcdf(Math.sqrt(t2),N-2))):0;
      gr.push([gr.length+1,N,f(v[bi]),f(G),f(Gc),P(p)]);
      if (G<=Gc) break; add(rest[bi],"Grubbs"); rest.splice(bi,1);
    }
    const list=[...fl].sort((x,y)=>all[x[0]]-all[y[0]]).map(([i,m])=>[D.rows.indexOf(rows[i])+1,f(all[i]),f((all[i]-s.mean)/s.sd),m.join(', ')]);
    return table(['Method','Lower limit','Upper limit','Flagged'],[
        ['Tukey fences (1.5 × IQR)',f(f15[0]),f(f15[1]),a.filter(v=>v<f15[0]||v>f15[1]).length],
        ['Extreme (3 × IQR)',f(f3[0]),f(f3[1]),a.filter(v=>v<f3[0]||v>f3[1]).length],
        ['z-score (|z| > 3)',f(s.mean-3*s.sd),f(s.mean+3*s.sd),a.filter(v=>Math.abs(v-s.mean)>3*s.sd).length]])
      + h5(`Grubbs' test (iterative, two-sided, α = ${al})`)+table(['Step','N','Most extreme value','G','G critical','p'],gr)
      + (list.length ? h5('Flagged observations')+table(['Row #','Value','z','Flagged by'],list.slice(0,300)) : note('No observations were flagged.'))
      + `<div class="plots">${boxSVG([[D.cols[o.x],a]],{})}</div>`
      + note("Grubbs' test assumes the remaining data are approximately normal. Flagged values should be checked, not automatically removed.");
  }},
glm:{ g:'Compare means', name:'ANCOVA / general linear model',
  fields:[{k:'y',t:'num',label:'Dependent variable'},{k:'facs',t:'cols',label:'Fixed factors (treated as categorical)'},{k:'covs',t:'nums',label:'Covariates (numeric)'},{k:'inter',t:'check',label:'Include all factor interactions (full factorial)',def:true},{k:'emm',t:'check',label:'Estimated marginal means with Bonferroni pairwise comparisons',def:true}],
  run(o){
    const facs=o.facs.filter(j=>j!==o.y), covs=o.covs.filter(j=>j!==o.y&&!facs.includes(j));
    need(facs.length||covs.length,'Select at least one factor or covariate.'); need(facs.length<=4,'At most 4 factors.');
    const Y=numCol(o.y), Fv=facs.map(strCol), Cv=covs.map(numCol);
    const idx=Y.map((_,i)=>i).filter(i=>Number.isFinite(Y[i])&&Fv.every(c=>c[i]!=null)&&Cv.every(c=>Number.isFinite(c[i])));
    const y=idx.map(i=>Y[i]), n=y.length, lv=Fv.map(c=>sortLevels([...new Set(idx.map(i=>c[i]))]));
    lv.forEach((l,k)=>need(l.length>=2,`Factor "${D.cols[facs[k]]}" needs at least 2 levels.`));
    const code=(k,L)=>lv[k].slice(0,-1).map(Lc=>L===Lc?1:L===lv[k][lv[k].length-1]?-1:0);
    const fcodes=Fv.map((c,k)=>idx.map(i=>code(k,c[i])));
    const subsets=[]; for (let m=1;m<(1<<facs.length);m++){ const s=facs.map((_,k)=>k).filter(k=>m&(1<<k)); if (o.inter||s.length===1) subsets.push(s); }
    subsets.sort((a,b)=>a.length-b.length);
    const combos=s=>s.reduce((acc,k)=>acc.flatMap(c=>[...Array(lv[k].length-1).keys()].map(q=>[...c,[k,q]])),[[]]);
    const terms=subsets.map(s=>({label:s.map(k=>cname(facs[k])).join(' × '), s, cols:combos(s).map(cb=>idx.map((_,r)=>cb.reduce((p,[k,q])=>p*fcodes[k][r][q],1)))}));
    covs.forEach((j,c)=>terms.push({label:cname(j), cov:c, cols:[idx.map(i=>Cv[c][i])]}));
    const fit=skip=>{ const cols=terms.filter(t=>t!==skip).flatMap(t=>t.cols); return ols(y.map((_,r)=>[1,...cols.map(c=>c[r])]),y); };
    const full=fit(null); need(full,'The design is singular — some factor combinations are probably empty. Try without interactions.');

    const rows=terms.map(t=>{ const m=fit(t), ss=m?m.sse-full.sse:NaN, df=t.cols.length, F=(ss/df)/mse, pv=fUpper(F,df,dfe);
      rep.push(`${t.label}: F(${df}, ${dfe}) = ${f(F,2)}, p ${pAPA(pv)}`); return [t.label,f(ss),df,f(ss/df),f(F),P(pv),f(ss/(ss+full.sse))]; });
    rows.push(['Residuals',f(full.sse),dfe,f(mse),'','',''],['Total (corrected)',f(full.sst),n-1,'','','','']);
    let out=table(['N','R²','Adjusted R²','Residual SE'],[[n,f(full.r2),f(1-(1-full.r2)*(n-1)/dfe),f(Math.sqrt(mse))]])
      + h5('Tests of between-subjects effects (Type III SS)')+table(['Source','Sum of squares','df','Mean square','F','p','Partial η²'],rows);
    let off=1; const pos=new Map(); terms.forEach(t=>{ pos.set(t,off); off+=t.cols.length; });
    if (covs.length) out+=h5('Covariate slopes')+table(['Covariate','B','SE','t','p'],terms.filter(t=>t.cov!=null).map(t=>{ const q=pos.get(t), b=full.b[q], se=Math.sqrt(full.inv[q][q]*mse); return [t.label,f(b),f(se),f(b/se),P(pT(b/se,dfe,'two'))]; }));
    let plot='';
    if (o.emm && facs.length){
      const cm=covs.map((_,c)=>mean(idx.map(i=>Cv[c][i]))), tq=tinv(0.975,dfe);
      const xrow=(k,L)=>{ const x=new Array(p).fill(0); x[0]=1; const cd=code(k,L);
        terms.forEach(t=>{ const q=pos.get(t); if (t.cov!=null) x[q]=cm[t.cov]; else if (t.s.length===1&&t.s[0]===k) cd.forEach((v,c)=>{ x[q+c]=v; }); }); return x; };
      const qf=(a,b)=>sum(a.map((v,i)=>v*sum(b.map((w,j)=>full.inv[i][j]*w))));
      facs.forEach((j,k)=>{
        const X=lv[k].map(L=>xrow(k,L)), em=X.map(x=>sum(x.map((v,i)=>v*full.b[i]))), se=X.map(x=>Math.sqrt(qf(x,x)*mse));
        out+=h5(`Estimated marginal means: ${cname(j)}`)+table(['Level','EMM','SE','95% CI'],lv[k].map((L,i)=>[esc(L),f(em[i]),f(se[i]),ci([em[i]-tq*se[i],em[i]+tq*se[i]])]));
        if (lv[k].length>2){ const pr=[], m=lv[k].length*(lv[k].length-1)/2;
          for (let a=0;a<lv[k].length;a++) for (let b=a+1;b<lv[k].length;b++){ const dx=X[a].map((v,i)=>v-X[b][i]), s=Math.sqrt(qf(dx,dx)*mse), dd=em[a]-em[b], t=dd/s;
            pr.push([`${esc(lv[k][a])} − ${esc(lv[k][b])}`,f(dd),f(s),f(t),P(Math.min(1,m*pT(t,dfe,'two')))]); }
          out+=table(['Comparison','Difference','SE','t','p (Bonferroni)'],pr); }
        if (k===0) plot=meansSVG(lv[k],[{name:'',pts:em.map((m,i)=>({m,lo:m-tq*se[i],hi:m+tq*se[i]}))}],{ylab:D.cols[o.y],xlab:D.cols[j],title:'Estimated marginal means ± 95% CI'});
      });
      if (covs.length) out+=note(`Marginal means are adjusted to covariate means: ${covs.map((j,c)=>`${cname(j)} = ${f(cm[c])}`).join(', ')}.`);
    }

  }},
ks:{ g:'Nonparametric', name:'Kolmogorov–Smirnov 2-sample test',
  fields:[{k:'y',t:'num',label:'Variable'},{k:'g',t:'col',label:'Grouping variable (2 levels)',prefCat:true}],
  run(o){
    const sp=twoGroups(o), [[l1,a],[l2,b]]=sp, sa=a.slice().sort((x,y)=>x-y), sb=b.slice().sort((x,y)=>x-y), n1=a.length, n2=b.length;
    const xs=[...new Set([...sa,...sb])].sort((x,y)=>x-y); let i=0,j=0,Dm=0; const e1=[], e2=[];
    for (const x of xs){ while (i<n1&&sa[i]<=x) i++; while (j<n2&&sb[j]<=x) j++; e1.push(i/n1); e2.push(j/n2); Dm=Math.max(Dm,Math.abs(i/n1-j/n2)); }
    const p=ksP(n1,n2,Dm);
    const Pl=makePlot({xmin:xs[0],xmax:xs[xs.length-1],ymin:0,ymax:1,xlab:D.cols[o.y],ylab:'Cumulative proportion',title:'Empirical CDFs',legend:[l1,l2]});
    const step=e=>{ let d=`M${Pl.sx(Pl.X.lo)},${Pl.sy(0)}`; xs.forEach((x,k)=>{ d+=`H${Pl.sx(x)}V${Pl.sy(e[k])}`; }); return d+`H${Pl.sx(Pl.X.hi)}`; };
    return grpStats(sp)+table(['D','p','Method'],[[f(Dm,4),P(p),n1*n2<=4e6?'exact':'asymptotic']])
      + `<div class="plots">${Pl.wrap(`<path d="${step(e1)}" style="stroke:${PAL[0]};stroke-width:2;fill:none"/><path d="${step(e2)}" style="stroke:${PAL[1]};stroke-width:2;fill:none"/>`)}</div>`
      + note('Tests whether the two samples come from the same distribution (any difference in location, spread or shape).')
      + report(`D = ${f(Dm,3)}, p ${pAPA(p)}`);
  }},
pcorr:{ g:'Relationships', name:'Partial correlation',
  fields:[{k:'x',t:'num',label:'Variable X'},{k:'y',t:'num',label:'Variable Y',nth:1},{k:'z',t:'nums',label:'Control variables'}],
  run(o){

consort:{ g:'Reports', name:'CONSORT flow diagram', noData:true, report:true,
  fields:[{k:'assessed',t:'number',label:'Assessed for eligibility',def:136},{k:'ex1',t:'number',label:'Excluded — not meeting inclusion criteria',def:18},{k:'ex2',t:'number',label:'Excluded — declined to participate',def:8},{k:'ex3',t:'number',label:'Excluded — other reasons',def:0},

const CRC_T=(()=>{ const t=new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();

    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0,true); h.setUint16(8,0,true); h.setUint16(10,dosT,true); h.setUint16(12,dosD,true);

    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0,true); c.setUint16(10,0,true); c.setUint16(12,dosT,true); c.setUint16(14,dosD,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);
    off+=30+nm.length+data.length;
  }
  const csz=sum(cen.map(x=>x.length)), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,csz,true); e.setUint32(16,off,true);

const escX = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
function wRun(t, fm={}){
  if (!t) return '';
  const pr=(fm.b?'<w:b/>':'')+(fm.i?'<w:i/>':'')+(fm.va?`<w:vertAlign w:val="${fm.va}"/>`:'')+(fm.sz?`<w:sz w:val="${fm.sz}"/><w:szCs w:val="${fm.sz}"/>`:'')+(fm.color?`<w:color w:val="${fm.color}"/>`:'');
  return `<w:r>${pr?`<w:rPr>${pr}</w:rPr>`:''}<w:t xml:space="preserve">${escX(t)}</w:t></w:r>`;
}
function wRuns(node, fm={}){
  let out='';
  for (const ch of node.childNodes){
    if (ch.nodeType===3){ out+=wRun(ch.textContent.replace(/\s+/g,' '), fm); continue; }
    if (ch.nodeType!==1 || ch.hidden) continue;
    const tg=ch.tagName.toUpperCase();
    if (tg==='BR') out+='<w:r><w:br/></w:r>';
    else if (tg==='B'||tg==='STRONG') out+=wRuns(ch,{...fm,b:true});
    else if (tg==='I'||tg==='EM') out+=wRuns(ch,{...fm,i:true});
    else if (tg==='SUB'||tg==='SUP') out+=wRuns(ch,{...fm,va:tg==='SUB'?'subscript':'superscript'});
    else if (tg==='SMALL'||ch.classList.contains('sub')) out+=(out?'<w:r><w:br/></w:r>':'')+wRuns(ch,{...fm,sz:Math.max(14,(fm.sz||22)-4)});
    else if (tg==='DIV'||tg==='P') out+=(out?'<w:r><w:br/></w:r>':'')+wRuns(ch,fm);
    else if (tg==='SVG'||tg==='BUTTON') continue;
    else out+=wRuns(ch,fm);
  }
  return out;
}
const wPara=(inner,{jc,ind,before=0,after=120,line=360,keep}={})=>`<w:p><w:pPr>${keep?'<w:keepNext/>':''}<w:spacing w:before="${before}" w:after="${after}" w:line="${line}" w:lineRule="auto"/>${ind?'<w:ind w:firstLine="720"/>':''}${jc?`<w:jc w:val="${jc}"/>`:''}</w:pPr>${inner}</w:p>`;
function wTable(tbl){
  const grid=[], rows=[...tbl.rows], nHead=tbl.tHead?tbl.tHead.rows.length:0, rpt=tbl.classList.contains('rpt');
  rows.forEach((tr,r)=>{ grid[r]=grid[r]||[]; let c=0;
    for (const cell of tr.cells){ while (grid[r][c]) c++; const cs=cell.colSpan||1, rs=cell.rowSpan||1;
      for (let dr=0;dr<rs;dr++){ grid[r+dr]=grid[r+dr]||[]; for (let dc=0;dc<cs;dc++) grid[r+dr][c+dc]={cell,top:dr===0,lead:dc===0,cs,rs}; }
      c+=cs; } });
  const ncol=Math.max(...grid.map(g=>g.length)), cw=Math.floor(9000/ncol);
  const B=['top','left','bottom','right','insideH','insideV'].map(b=>`<w:${b} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('');
  let x=`<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:jc w:val="center"/><w:tblBorders>${B}</w:tblBorders><w:tblLayout w:type="autofit"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${`<w:gridCol w:w="${cw}"/>`.repeat(ncol)}</w:tblGrid>`;
  grid.forEach((g,r)=>{
    x+=`<w:tr>${r<nHead?'<w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>':'<w:trPr><w:cantSplit/></w:trPr>'}`;
    for (let c=0;c<ncol;c++){
      const e=g[c];
      if (!e){ x+=`<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="dxa"/></w:tcPr><w:p/></w:tc>`; continue; }
      if (!e.lead) continue;
      const th=e.cell.tagName==='TH', bold=th||e.cell.classList.contains('sig')||e.cell.classList.contains('hi');
      const pr=`<w:tcPr><w:tcW w:w="${cw*e.cs}" w:type="dxa"/>${e.cs>1?`<w:gridSpan w:val="${e.cs}"/>`:''}${e.rs>1?(e.top?'<w:vMerge w:val="restart"/>':'<w:vMerge/>'):''}${th?'<w:shd w:val="clear" w:color="auto" w:fill="BFBFBF"/>':''}<w:vAlign w:val="center"/></w:tcPr>`;
      const jc=(c===0&&!th&&!rpt)?'left':'center';
      x+=`<w:tc>${pr}<w:p><w:pPr><w:spacing w:before="30" w:after="30" w:line="240" w:lineRule="auto"/><w:jc w:val="${jc}"/></w:pPr>${e.top?wRuns(e.cell,{b:bold||undefined,sz:22}):''}</w:p></w:tc>`;
    }
    x+='</w:tr>';
  });
  return x+'</w:tbl>';
}
function svgToPng(svg, scale=2){
  return new Promise((res,rej)=>{
    const str=svgString(svg,{noTitle:true}), vb=svg.viewBox.baseVal, img=new Image();
    img.onload=()=>{ const c=document.createElement('canvas'); c.width=vb.width*scale; c.height=vb.height*scale; const ctx=c.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
      c.toBlob(b=>b?b.arrayBuffer().then(a=>res({data:new Uint8Array(a),w:vb.width,h:vb.height})):rej(new Error('PNG conversion failed')),'image/png'); };
    img.onerror=()=>rej(new Error('Chart could not be rendered'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);
  });
}
async function exportDocx(){
  const cards=[...$('#results').children];
  if (!cards.length){ alert('There are no results to export yet.'); return; }
  const btn=$('#bWord'), label=btn.textContent; btn.disabled=true; btn.textContent='Building Word file…';
  const root=document.documentElement, prevTheme=root.dataset.theme; root.dataset.theme='light'; // charts in print colours
  try {
    let body='', nT=0, nF=0; const imgs=[];
    body+=wPara(wRun('Results',{b:true,sz:32}),{jc:'center',after:240});
    for (const card of cards){
      const bd=card.querySelector('.body'), title=card.querySelector('h3').textContent;
      if (!bd.querySelector('.noheading')) body+=wPara(wRun(title,{b:true,sz:26}),{before:240,after:120,keep:true});
      let caption=null, usedTitle=false;
      for (const el of bd.children){
        if (el.hidden) continue;
        const tg=el.tagName;
        if (tg==='H5'){ body+=wPara(wRuns(el,{b:true}),{before:160,after:80,keep:true}); caption=el.textContent; }
        else if (el.classList.contains('caption')){ caption=el.textContent.replace(/^Table:\s*/,''); }
        else if (tg==='TABLE'){
          const cap=caption||(usedTitle?`${title} (continued)`:title); usedTitle=true; caption=null;
          body+=wPara(wRun(`Table ${++nT}: ${cap}`,{b:true}),{before:200,after:80,line:240,keep:true})+wTable(el);
        }
        else if (el.classList.contains('plots')){
          for (const svg of el.querySelectorAll('svg.plot')){
            const png=await svgToPng(svg), id=imgs.length+1, cx=Math.round(5.6*914400), cy=Math.round(cx*png.h/png.w);
            imgs.push(png.data); nF++;
            body+=`<w:p><w:pPr><w:keepNext/><w:spacing w:before="200" w:after="60"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="Figure ${id}"/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="image${id}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${id}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
            const ft=svg.querySelector('.ttl')?.textContent || title;
            body+=wPara(wRun(`Figure ${nF}: ${ft}`,{b:true}),{jc:'center',after:200,line:240});
          }
        }
        else if (el.classList.contains('para')) body+=wPara(wRuns(el),{jc:'both',ind:true});
        else if (el.classList.contains('note')) body+=wPara(wRuns(el,{sz:20}),{after:160,line:240});
        else if (el.classList.contains('report')) body+=wPara(wRuns(el,{i:true}),{after:160});
        else if (el.classList.contains('warn')) body+=wPara(wRuns(el,{i:true,color:'B45309'}),{after:160});
      }
    }
    const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
    const X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    const doc=`${X}<w:document ${NS}><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
    const styles=`${X}<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="en-US"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;
    const rels=`${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${imgs.map((_,i)=>`<Relationship Id="rIdImg${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/image${i+1}.png"/>`).join('')}</Relationships>`;
    const files=[
      {name:'[Content_Types].xml', data:`${X}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`},
      {name:'_rels/.rels', data:`${X}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`},
      {name:'docProps/core.xml', data:`${X}<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>Statistical results</dc:title><dc:creator>StatBench</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0,19)}Z</dcterms:created></cp:coreProperties>`},
      {name:'word/document.xml', data:doc},
      {name:'word/styles.xml', data:styles},
      {name:'word/_rels/document.xml.rels', data:rels},
      ...imgs.map((d,i)=>({name:`word/media/image${i+1}.png`, data:d})),

  } catch(err){ alert('Word export failed: '+err.message); console.error(err); }

}

/* ================= Results ================= */
function addResult(title, html, useData=true){
  const el=document.createElement('article'); el.className='card';
  const flt = useData && D.filter && MASK ? `Filter: <code>${esc(D.filter)}</code> (n = ${MASK.filter(Boolean).length}) · ` : '';
  el.innerHTML=`<header><h3>${esc(title)}</h3><span class="meta">${flt}${new Date().toLocaleString()}</span><button class="mv" data-d="-1" title="Move up">↑</button><button class="mv" data-d="1" title="Move down">↓</button><button class="copy" title="Copy tables as tab-separated text (paste into Excel/Word)">Copy</button><button class="x" title="Remove">×</button></header><div class="body">${html}</div>`;
  el.querySelectorAll('svg.plot').forEach(svg=>{ const w=document.createElement('div'); w.className='pw'; svg.replaceWith(w); w.append(svg);
    w.insertAdjacentHTML('beforeend','<div class="dlbar"><button class="dl" data-f="png" title="Download as PNG image">PNG</button><button class="dl" data-f="svg" title="Download as SVG vector image">SVG</button></div>'); });
  el.querySelectorAll('h3, h5, .caption, .para').forEach(n=>{ n.contentEditable='true'; n.spellcheck=true; });
  $('#results').append(el); saveResults(); showTab('results'); el.scrollIntoView({block:'start'});
}
$('#results').addEventListener('click', e=>{
  if (e.target.matches('.card>header .x')){ e.target.closest('.card').remove(); saveResults(); }
  else if (e.target.matches('.dl')){
    const svg=e.target.closest('.pw').querySelector('svg'), str=svgString(svg), name=(svg.querySelector('.ttl')?.textContent||'chart').replace(/[^\w-]+/g,'_').slice(0,40);
    if (e.target.dataset.f==='svg') download(name+'.svg', str, 'image/svg+xml');
    else { const vb=svg.viewBox.baseVal, img=new Image(), sc=2;
      img.onload=()=>{ const c=document.createElement('canvas'); c.width=vb.width*sc; c.height=vb.height*sc; const ctx=c.getContext('2d'); ctx.scale(sc,sc); ctx.drawImage(img,0,0); c.toBlob(b=>download(name+'.png',b)); };
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str); }
  }
  else if (e.target.matches('.card>header .mv')){ const c=e.target.closest('.card'), d=+e.target.dataset.d, o=d<0?c.previousElementSibling:c.nextElementSibling; if (o){ d<0?o.before(c):o.after(c); saveResults(); c.scrollIntoView({block:'nearest'}); } }
  else if (e.target.matches('.card>header .copy')){
    const card=e.target.closest('.card'), parts=[card.querySelector('h3').textContent];
    for (const el of card.querySelectorAll('.body > h5, .body > .caption, .body > table, .body > .para, .body > .note, .body > .report, .body > .warn')){
      if (el.tagName==='TABLE') parts.push([...el.rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/\s*\n\s*/g,' ').trim()).join('\t')).join('\n'));
      else parts.push(el.innerText.trim());
    }
    const txt=parts.join('\n\n'), btn=e.target;
    const done=()=>{ btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent='Copy',1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done,()=>alert('Clipboard not available.'));
  }
});

};

  $('#tab-data').hidden = t!=='data'; $('#tab-results').hidden = t!=='results';

(function buildSide(){
  const groups=new Map();
  for (const [k,A] of Object.entries(AN)){ if (!groups.has(A.g)) groups.set(A.g,[]); groups.get(A.g).push(`<button data-an="${k}">${A.name}</button>`); }

  $('#side').innerHTML=[...groups].sort((a,b)=>(ORDER.indexOf(a[0])+99)%99-(ORDER.indexOf(b[0])+99)%99).map(([g,b])=>`<h4>${g}</h4>${b.join('')}`).join('');
